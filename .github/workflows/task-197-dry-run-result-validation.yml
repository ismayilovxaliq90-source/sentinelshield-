name: TASK 197 - Dry Run Result Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/dry_run_result_validation.py"
      - "src/sentinelshield/remediation_dry_run.py"
      - "tests/test_dry_run_result_validation.py"
      - ".github/workflows/task-197-dry-run-result-validation.yml"

permissions:
  contents: read

jobs:
  task-197:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify imports
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.remediation_dry_run"
          python -c "import sentinelshield.dry_run_result_validation"

      - name: Run TASK 197 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_dry_run_result_validation.py

      - name: Live TASK 197 validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.dry_run_result_validation import (
              DryRunResultValidationError,
              validate_dry_run_result,
          )
          from sentinelshield.remediation_dry_run import (
              RemediationDryRunResult,
          )

          valid = RemediationDryRunResult(
              valid=True,
              executable="package-manager",
              arguments=("update", "safe-package"),
              working_directory="/tmp/task-197-workspace",
              environment_keys=("CI",),
              timeout_seconds=60.0,
              executed=False,
              filesystem_modified=False,
              reason="DRY_RUN_VALIDATED_WITHOUT_EXECUTION",
          )

          result = validate_dry_run_result(valid)

          if not result.valid:
              raise SystemExit(
                  "TASK 197 FAIL: valid dry-run result rejected"
              )

          if result.executed:
              raise SystemExit(
                  "TASK 197 FAIL: validated result reports execution"
              )

          if result.filesystem_modified:
              raise SystemExit(
                  "TASK 197 FAIL: validated result reports filesystem modification"
              )

          invalid = RemediationDryRunResult(
              valid=True,
              executable="package-manager",
              arguments=("update",),
              working_directory="/tmp/task-197-workspace",
              environment_keys=(),
              timeout_seconds=60.0,
              executed=True,
              filesystem_modified=False,
              reason="INVALID_EXECUTION_STATE",
          )

          try:
              validate_dry_run_result(invalid)
          except DryRunResultValidationError:
              pass
          else:
              raise SystemExit(
                  "TASK 197 FAIL: executed result accepted as dry-run"
              )

          print("TASK 197 PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 197 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi

          echo "TASK 197 PASS: no bytecode changes"
