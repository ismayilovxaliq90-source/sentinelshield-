name: Task 209 - Remediation Scope Enforcement

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  task-209:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify SentinelShield import
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/src/sentinelshield"
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          PYTHONDONTWRITEBYTECODE=1 python -c \
            "import sentinelshield; print(sentinelshield.__file__)"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Task 209 unit tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q \
            tests/test_remediation_scope_enforcement.py

      - name: Live Task 209 validation
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          from sentinelshield.remediation_scope_enforcement import (
              enforce_remediation_scope,
          )

          root = Path(
              tempfile.mkdtemp(
                  prefix="task-209-"
              )
          )

          subprocess.run(
              ["git", "init"],
              cwd=root,
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          subprocess.run(
              ["git", "config", "user.email", "ci@example.com"],
              cwd=root,
              check=True,
          )

          subprocess.run(
              ["git", "config", "user.name", "SentinelShield CI"],
              cwd=root,
              check=True,
          )

          manifest = root / "package.json"
          manifest.write_text(
              '{"version":1}\n',
              encoding="utf-8",
          )

          subprocess.run(
              ["git", "add", "."],
              cwd=root,
              check=True,
          )

          subprocess.run(
              ["git", "commit", "-m", "baseline"],
              cwd=root,
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          manifest.write_text(
              '{"version":2}\n',
              encoding="utf-8",
          )

          result = enforce_remediation_scope(
              root,
              ["package.json"],
          )

          assert result.valid is True
          assert result.passed is True
          assert result.out_of_scope_changes == ()

          unexpected = root / "unexpected.txt"
          unexpected.write_text(
              "unexpected\n",
              encoding="utf-8",
          )

          result = enforce_remediation_scope(
              root,
              ["package.json"],
          )

          assert result.valid is True
          assert result.passed is False
          assert result.out_of_scope_changes
          assert (
              result.out_of_scope_changes[0].path
              == "unexpected.txt"
          )

          print("TASK 209 LIVE VALIDATION: PASS")
          print(result.to_json())
          PY

      - name: Verify no changed or new Python bytecode
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain=v1 --untracked-files=all \
            | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "TASK 209 FAIL: Python bytecode changed or created"
            exit 1
          fi

      - name: Final Git status
        run: |
          git status --short
