name: Task 209 - Remediation Scope Enforcement

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/remediation_scope_enforcement.py"
      - "tests/test_remediation_scope_enforcement.py"
      - ".github/workflows/task-209-remediation-scope-enforcement.yml"
  pull_request:
    paths:
      - "src/sentinelshield/remediation_scope_enforcement.py"
      - "tests/test_remediation_scope_enforcement.py"
      - ".github/workflows/task-209-remediation-scope-enforcement.yml"

permissions:
  contents: read

jobs:
  task-209:
    name: Task 209 isolated validation
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify Task 209 module only
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/src/sentinelshield/remediation_scope_enforcement.py"
          test -f "$GITHUB_WORKSPACE/tests/test_remediation_scope_enforcement.py"

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 python -c \
            "from sentinelshield.remediation_scope_enforcement import enforce_remediation_scope; print('TASK 209 IMPORT: PASS')"

      - name: Run ONLY Task 209 tests
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q \
            tests/test_remediation_scope_enforcement.py

      - name: Task 209 isolated live validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          from sentinelshield.remediation_scope_enforcement import (
              enforce_remediation_scope,
              validate_remediation_scope_result,
          )

          root = Path(
              tempfile.mkdtemp(
                  prefix="sentinelshield-task-209-"
              )
          )

          subprocess.run(
              ["git", "init"],
              cwd=root,
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "ci@sentinelshield.local",
              ],
              cwd=root,
              check=True,
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "SentinelShield CI",
              ],
              cwd=root,
              check=True,
          )

          service = root / "service"
          service.mkdir()

          manifest = service / "package.json"
          manifest.write_text(
              '{"version":1}\n",
              encoding="utf-8",
          )

          unrelated = root / "README.md"
          unrelated.write_text(
              "baseline\n",
              encoding="utf-8",
          )

          subprocess.run(
              ["git", "add", "."],
              cwd=root,
              check=True,
          )

          subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "baseline",
              ],
              cwd=root,
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          manifest.write_text(
              '{"version":2}\n",
              encoding="utf-8",
          )

          result = enforce_remediation_scope(
              root,
              ["service"],
          )

          assert result.valid is True
          assert result.in_scope is True
          assert result.out_of_scope_changes == ()
          assert validate_remediation_scope_result(
              result
          ) is True

          unrelated.write_text(
              "UNEXPECTED CHANGE\n",
              encoding="utf-8",
          )

          result = enforce_remediation_scope(
              root,
              ["service"],
          )

          assert result.valid is True
          assert result.in_scope is False
          assert len(result.out_of_scope_changes) == 1
          assert (
              result.out_of_scope_changes[0].path
              == "README.md"
          )
          assert validate_remediation_scope_result(
              result
          ) is False

          print("TASK 209 LIVE VALIDATION: PASS")
          PY

      - name: Verify no bytecode changes
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain=v1 --untracked-files=all \
            | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "TASK 209 FAIL: bytecode change detected"
            exit 1
          fi

      - name: Task 209 completion
        run: |
          echo "TASK 209: ISOLATED VALIDATION COMPLETE"
