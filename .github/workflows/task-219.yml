name: SentinelShield TASK 219

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/dependency_version_diff.py"
      - "tests/test_dependency_version_diff.py"
      - ".github/workflows/task-219.yml"

jobs:
  task-219:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run TASK 219
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_dependency_version_diff.py
