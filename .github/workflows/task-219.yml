name: TASK 219 - Dependency Version Diff Validation

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-219:
    name: TASK 219 Server Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile TASK 219
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile \
            src/sentinelshield/dependency_version_diff_validation.py \
            tests/test_dependency_version_diff_validation.py

      - name: Run TASK 219 tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_dependency_version_diff_validation.py

      - name: TASK 219 functional verification
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from sentinelshield.dependency_version_diff_validation import (
              validate_dependency_version_diff,
          )

          result = validate_dependency_version_diff(
              {"requests": "2.31.0"},
              {"requests": "2.32.0"},
              {"requests": "2.32.0"},
          )

          assert result.changed == ("requests",)
          assert result.unexpected == ()
          assert result.status == "VALIDATED"

          result = validate_dependency_version_diff(
              {"requests": "2.31.0"},
              {"requests": "2.33.0"},
              {"requests": "2.32.0"},
          )

          assert result.changed == ("requests",)
          assert result.unexpected == ("requests",)
          assert result.status == "UNEXPECTED_CHANGES"

          result = validate_dependency_version_diff(
              {},
              {"urllib3": "2.0.7"},
              {"urllib3": "2.0.7"},
          )

          assert result.added == ("urllib3",)
          assert result.unexpected == ()
          assert result.status == "VALIDATED"

          result = validate_dependency_version_diff(
              {
                  "requests": "2.31.0",
                  "urllib3": "2.0.7",
              },
              {
                  "requests": "2.31.0",
              },
          )

          assert result.removed == ("urllib3",)
          assert result.unexpected == ("urllib3",)

          print("TASK 219 functional verification: PASS")
          PY

      - name: Full regression suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q

      - name: TASK 219 PASS
        run: |
          echo
          echo "============================================================"
          echo "TASK 219 — DEPENDENCY VERSION DIFF VALIDATION: PASS"
          echo "EXECUTED ON GITHUB ACTIONS RUNNER"
          echo "============================================================"
