name: Task 188 - Command Allowlist Validation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-188:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify Task 188 test file
        run: |
          test -f tests/test_command_allowlist_validation.py

      - name: Run ONLY Task 188 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_command_allowlist_validation.py

      - name: Task 188 live validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.command_allowlist_validation import (
              CommandAllowlistPolicy,
              validate_command_allowlist,
          )

          policy = CommandAllowlistPolicy({"git", "python"})

          allowed = validate_command_allowlist(
              ["git", "status"],
              policy,
          )

          assert allowed.allowed is True
          assert allowed.executable == "git"
          assert allowed.reason == "COMMAND_ALLOWED"

          denied = validate_command_allowlist(
              ["rm", "-rf", "/"],
              policy,
          )

          assert denied.allowed is False
          assert denied.executable == "rm"
          assert denied.reason == "EXECUTABLE_NOT_ALLOWED"

          print("TASK 188 LIVE VALIDATION PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          if git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 188 FAIL: bytecode changes detected"
            git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "BYTECODE CHECK PASS"

      - name: Task 188 PASS
        run: |
          echo "========================================"
          echo "TASK 188 — COMMAND ALLOWLIST VALIDATION"
          echo "PASS"
          echo "========================================"
