name: Task 188 - Command Allowlist Validation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-188:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify SentinelShield import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield"

      # --------------------------------------------------------
      # Regression guard:
      # Task 184 detached HEAD behavior must remain correct.
      # --------------------------------------------------------
      - name: Run Task 184 regression tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_baseline_snapshot.py

      # --------------------------------------------------------
      # Task 188 dedicated tests.
      # --------------------------------------------------------
      - name: Run Task 188 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_command_allowlist_validation.py

      # --------------------------------------------------------
      # Live Task 184 detached HEAD validation.
      # --------------------------------------------------------
      - name: Validate detached HEAD support
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          from sentinelshield.baseline_snapshot import (
              create_baseline_snapshot,
          )

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp) / "repo"
              root.mkdir()

              def git(*args: str) -> None:
                  subprocess.run(
                      ["git", *args],
                      cwd=root,
                      check=True,
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                  )

              git("init")
              git("config", "user.email", "actions@github.com")
              git("config", "user.name", "GitHub Actions")

              source = root / "app.py"
              source.write_text(
                  "value = 1\n",
                  encoding="utf-8",
              )

              git("add", "app.py")
              git("commit", "-m", "initial")
              git("checkout", "--detach", "HEAD")

              snapshot = create_baseline_snapshot(root)

              if snapshot.branch is not None:
                  raise RuntimeError(
                      "TASK 184 REGRESSION: detached HEAD must produce branch=None"
                  )

              if not snapshot.head:
                  raise RuntimeError(
                      "TASK 184 REGRESSION: HEAD must still be captured"
                  )

              print("TASK 184 PASS: detached HEAD supported")
              print("branch:", snapshot.branch)
              print("head:", snapshot.head)
          PY

      # --------------------------------------------------------
      # Live Task 188 validation.
      # --------------------------------------------------------
      - name: Live Task 188 validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.command_allowlist_validation import (
              CommandAllowlistPolicy,
              validate_command_allowlist,
          )

          policy = CommandAllowlistPolicy.from_iterable(
              {"git", "python3", "node"}
          )

          allowed = validate_command_allowlist(
              ["git", "status"],
              policy,
          )

          denied = validate_command_allowlist(
              ["curl", "https://example.com"],
              policy,
          )

          path_denied = validate_command_allowlist(
              ["/usr/bin/git", "status"],
              policy,
          )

          shell_denied = validate_command_allowlist(
              ["git;rm", "-rf"],
              policy,
          )

          print("=== TASK 188 LIVE VALIDATION ===")
          print("allowed:", allowed.to_dict())
          print("denied:", denied.to_dict())
          print("path_denied:", path_denied.to_dict())
          print("shell_denied:", shell_denied.to_dict())

          if not allowed.allowed:
              raise RuntimeError(
                  "TASK 188 FAIL: allowlisted executable rejected"
              )

          if denied.allowed:
              raise RuntimeError(
                  "TASK 188 FAIL: non-allowlisted executable accepted"
              )

          if path_denied.allowed:
              raise RuntimeError(
                  "TASK 188 FAIL: path-qualified executable accepted"
              )

          if shell_denied.allowed:
              raise RuntimeError(
                  "TASK 188 FAIL: shell syntax accepted"
              )

          print("TASK 188 PASS: command allowlist enforced")
          PY

      # --------------------------------------------------------
      # Prevent pytest from modifying tracked Python bytecode.
      # --------------------------------------------------------
      - name: Verify no Python bytecode changes
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 188 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

          echo "TASK 188 PASS: no Python bytecode changes"

      - name: Final Task 188 status
        run: |
          echo "TASK 188 GitHub Actions validation completed"
