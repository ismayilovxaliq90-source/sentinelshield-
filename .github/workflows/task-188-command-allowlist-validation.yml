name: TASK 188 - Command Allowlist Validation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-188:
    name: Validate Task 188
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Task 188 tests
        run: |
          python -m pytest -q tests/test_command_allowlist_validation.py

      - name: Run Task 188 live validation
        run: |
          python - <<'PY'
          from sentinelshield.command_allowlist_validation import (
              validate_command_allowlist,
          )

          allowed = validate_command_allowlist(["python", "--version"])
          assert allowed.valid is True

          blocked = validate_command_allowlist(["bash"])
          assert blocked.valid is False

          path_blocked = validate_command_allowlist(["/usr/bin/python"])
          assert path_blocked.valid is False

          shell_blocked = validate_command_allowlist(["python;rm"])
          assert shell_blocked.valid is False

          null_blocked = validate_command_allowlist(["python\x00evil"])
          assert null_blocked.valid is False

          print("TASK 188 LIVE VALIDATION: PASS")
          PY

      - name: Verify no new bytecode files
        shell: bash
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
            '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 188 FAIL: new or modified Python bytecode detected"
            git status --short
            exit 1
          fi

          echo "TASK 188 BYTECODE CHECK: PASS"

      - name: Verify Task 188 file scope
        shell: bash
        run: |
          expected_1="src/sentinelshield/command_allowlist_validation.py"
          expected_2="tests/test_command_allowlist_validation.py"
          expected_3=".github/workflows/task-188-command-allowlist-validation.yml"

          for file in "$expected_1" "$expected_2" "$expected_3"; do
            test -f "$file" || {
              echo "TASK 188 FAIL: missing $file"
              exit 1
            }
          done

          echo "TASK 188 FILE SCOPE: PASS"
