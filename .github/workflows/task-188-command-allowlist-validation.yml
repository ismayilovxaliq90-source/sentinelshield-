name: Task 188 - Command Allowlist Validation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-188:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify source import path
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.command_allowlist_validation"

      - name: Run Task 188 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_command_allowlist_validation.py

      - name: Live allowlist validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.command_allowlist_validation import (
              validate_command_allowlist,
          )

          print("=== TASK 188 LIVE VALIDATION ===")

          allowed = validate_command_allowlist(
              ["python", "--version"]
          )

          print("allowed command:", allowed.to_dict())

          if not allowed.allowed:
              raise RuntimeError(
                  f"TASK 188 FAIL: allowlisted command rejected: "
                  f"{allowed.reason}"
              )

          rejected = validate_command_allowlist(
              ["curl", "https://example.com"]
          )

          print("rejected command:", rejected.to_dict())

          if rejected.allowed:
              raise RuntimeError(
                  "TASK 188 FAIL: non-allowlisted executable accepted"
              )

          shell_string = validate_command_allowlist(
              "python -c 'print(1)'"
          )

          print("shell string:", shell_string.to_dict())

          if shell_string.allowed:
              raise RuntimeError(
                  "TASK 188 FAIL: shell command string accepted"
              )

          shell_expression = validate_command_allowlist(
              ["python;rm"]
          )

          print("shell expression:", shell_expression.to_dict())

          if shell_expression.allowed:
              raise RuntimeError(
                  "TASK 188 FAIL: shell expression accepted"
              )

          print("TASK 188 PASS: command allowlist enforced")
          PY

      - name: Verify no Python bytecode changes
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 188 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

          echo "TASK 188 PASS: no Python bytecode changes"

      - name: Verify repository changes are limited to expected Task 188 files
        run: |
          unexpected="$(
            git status --porcelain=v1 --untracked-files=all |
            awk '
              {
                path=$0
                sub(/^.. /, "", path)
                if (
                  path != "src/sentinelshield/command_allowlist_validation.py" &&
                  path != "tests/test_command_allowlist_validation.py" &&
                  path != ".github/workflows/task-188-command-allowlist-validation.yml"
                ) print path
              }
            '
          )"

          if [ -n "$unexpected" ]; then
            echo "TASK 188 FAIL: unexpected repository changes detected"
            printf '%s\n' "$unexpected"
            git status --short
            exit 1
          fi

          echo "TASK 188 PASS: repository change scope is clean"
