name: TASK 198 - Package Manager Command Generation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/package_manager_command_generation.py"
      - "tests/test_package_manager_command_generation.py"
      - ".github/workflows/task-198-package-manager-command-generation.yml"

jobs:
  task-198:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify module import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "from sentinelshield.package_manager_command_generation import generate_package_manager_command; print('TASK 198 IMPORT PASS')"

      - name: Run TASK 198 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_package_manager_command_generation.py

      - name: Live command-generation validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python - <<'PY'
          from sentinelshield.package_manager_command_generation import (
              generate_package_manager_command,
          )

          result = generate_package_manager_command(
              "python",
              "pip",
              "requests",
              "2.32.4",
          )

          expected = (
              "python3",
              "-m",
              "pip",
              "install",
              "requests==2.32.4",
          )

          if result.command != expected:
              print("TASK 198 FAIL: unexpected command vector")
              print("actual:", result.command)
              print("expected:", expected)
              raise SystemExit(1)

          if result.executed:
              print("TASK 198 FAIL: command marked executed")
              raise SystemExit(1)

          print("TASK 198 LIVE PASS")
          print("command:", result.command)
          print("executed:", result.executed)
          PY

      - name: Security validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python - <<'PY'
          from sentinelshield.package_manager_command_generation import (
              PackageManagerCommandGenerationError,
              generate_package_manager_command,
          )

          blocked = [
              "requests;whoami",
              "requests && whoami",
              "requests|cat",
              "requests`id`",
              "requests$(id)",
              "requests\nbad",
          ]

          for value in blocked:
              try:
                  generate_package_manager_command(
                      "python",
                      "pip",
                      value,
                      "1.0.0",
                  )
              except PackageManagerCommandGenerationError:
                  continue
              raise SystemExit(
                  f"TASK 198 FAIL: injection accepted: {value!r}"
              )

          print("TASK 198 SECURITY PASS")
          PY

      - name: Verify no tracked or generated bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"
          if [ -n "$changed" ]; then
            echo "TASK 198 FAIL: bytecode changes detected"
            printf '%s\n' "$changed"
            false
          fi
          echo "TASK 198 BYTECODE PASS"
