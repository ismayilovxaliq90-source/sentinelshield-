name: TASK 198 - Package Manager Command Generation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/package_manager_command_generation.py"
      - "src/sentinelshield/__init__.py"
      - "tests/test_package_manager_command_generation.py"
      - ".github/workflows/task-198-package-manager-command-generation.yml"

jobs:
  task-198:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Configure Python environment
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Verify repository layout
        run: |
          test -d "$GITHUB_WORKSPACE/src/sentinelshield"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/__init__.py"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/package_manager_command_generation.py"
          test -f "$GITHUB_WORKSPACE/tests/test_package_manager_command_generation.py"

          echo "REPOSITORY LAYOUT PASS"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PYTHONPATH=$PYTHONPATH"

      - name: Install pytest
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Verify sentinelshield import
        run: |
          python - <<'PY'
          import os
          import sys

          expected = os.path.join(os.environ["GITHUB_WORKSPACE"], "src")

          if expected not in sys.path:
              print("TASK 198 FAIL: src is not on sys.path")
              print("expected:", expected)
              print("sys.path:", sys.path)
              raise SystemExit(1)

          import sentinelshield
          from sentinelshield.package_manager_command_generation import (
              generate_package_manager_command,
              PackageManagerCommand,
              PackageManagerCommandPolicy,
          )

          print("TASK 198 IMPORT PASS")
          print("sentinelshield:", sentinelshield.__file__)
          print("PYTHONPATH:", os.environ.get("PYTHONPATH"))
          print("generator:", generate_package_manager_command)
          print("command type:", PackageManagerCommand)
          print("policy type:", PackageManagerCommandPolicy)
          PY

      - name: Run TASK 198 tests
        run: |
          python -m pytest -q tests/test_package_manager_command_generation.py

      - name: Live generation validation
        run: |
          python - <<'PY'
          from sentinelshield.package_manager_command_generation import (
              generate_package_manager_command,
          )

          result = generate_package_manager_command(
              "python",
              "pip",
              "requests",
              "2.32.4",
          )

          expected = (
              "python3",
              "-m",
              "pip",
              "install",
              "requests==2.32.4",
          )

          if result.command != expected:
              print("TASK 198 FAIL: command mismatch")
              print("actual:", result.command)
              print("expected:", expected)
              raise SystemExit(1)

          if result.executed is not False:
              print("TASK 198 FAIL: execution state is not False")
              raise SystemExit(1)

          print("TASK 198 LIVE PASS")
          print("command:", result.command)
          print("executed:", result.executed)
          PY

      - name: Security validation
        run: |
          python - <<'PY'
          from sentinelshield.package_manager_command_generation import (
              PackageManagerCommandGenerationError,
              generate_package_manager_command,
          )

          malicious_values = (
              "requests;whoami",
              "requests && whoami",
              "requests|cat",
              "requests`id`",
              "requests$(id)",
              "requests\nbad",
              "../requests",
          )

          for value in malicious_values:
              try:
                  generate_package_manager_command(
                      "python",
                      "pip",
                      value,
                      "1.0.0",
                  )
              except PackageManagerCommandGenerationError:
                  continue

              print(
                  "TASK 198 FAIL: injection accepted:",
                  repr(value),
              )
              raise SystemExit(1)

          print("TASK 198 SECURITY PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 198 FAIL: bytecode changes detected"
            printf '%s\n' "$changed"
            false
          fi

          echo "TASK 198 BYTECODE PASS"
