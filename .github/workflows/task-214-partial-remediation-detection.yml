name: TASK 214 - Partial Remediation Detection

on:
  push:
    paths:
      - "src/sentinelshield/partial_remediation_detection.py"
      - "tests/test_partial_remediation_detection.py"
      - ".github/workflows/task-214-partial-remediation-detection.yml"
  pull_request:
    paths:
      - "src/sentinelshield/partial_remediation_detection.py"
      - "tests/test_partial_remediation_detection.py"
      - ".github/workflows/task-214-partial-remediation-detection.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  task-214:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate task files
        run: |
          test -f src/sentinelshield/partial_remediation_detection.py
          test -f tests/test_partial_remediation_detection.py

      - name: Syntax validation without bytecode writes
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import ast
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])

          files = [
              root / "src/sentinelshield/partial_remediation_detection.py",
              root / "tests/test_partial_remediation_detection.py",
          ]

          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )
              print(f"SYNTAX OK: {path}")

          print("TASK 214 syntax validation: PASS")
          PY

      - name: Import validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import sentinelshield
          import sentinelshield.partial_remediation_detection as module

          required = [
              "PartialRemediationDetectionError",
              "RemediationState",
              "PartialRemediationResult",
              "detect_partial_remediation",
              "validate_partial_remediation",
              "collect_repository_changes",
              "detect_repository_partial_remediation",
          ]

          missing = [
              name for name in required
              if not hasattr(module, name)
          ]

          if missing:
              raise RuntimeError(
                  f"Missing TASK 214 API: {missing}"
              )

          print("TASK 214 import/integration validation: PASS")
          PY

      - name: Install test dependency
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Run TASK 214 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -B -m pytest -q tests/test_partial_remediation_detection.py

      - name: Live partial-remediation validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          from sentinelshield.partial_remediation_detection import (
              RemediationState,
              detect_partial_remediation,
          )

          result = detect_partial_remediation(
              expected_changes=[
                  "package.json",
                  "package-lock.json",
              ],
              actual_changes=[
                  "package.json",
          ],
          )

          assert result.state is RemediationState.PARTIAL
          assert result.applied_changes == {"package.json"}
          assert result.missing_changes == {"package-lock.json"}
          assert not result.unexpected_changes

          print("LIVE PARTIAL REMEDIATION CHECK: PASS")
          PY

      - name: Live unexpected-change validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          from sentinelshield.partial_remediation_detection import (
              RemediationState,
              detect_partial_remediation,
          )

          result = detect_partial_remediation(
              expected_changes=["package.json"],
              actual_changes=[
                  "package.json",
                  "unexpected.txt",
              ],
          )

          assert result.state is RemediationState.UNEXPECTED_CHANGE
          assert result.unexpected_changes == {"unexpected.txt"}
          assert result.is_safe is False

          print("LIVE UNEXPECTED CHANGE CHECK: PASS")
          PY

      - name: Bytecode protection check
        run: |
          if git status --porcelain -- '*.pyc' '*.pyo' | grep -q .; then
            echo "Unexpected Python bytecode changes detected."
            git status --porcelain -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "BYTECODE PROTECTION: PASS"

      - name: Final status
        run: |
          echo "TASK 214 - PARTIAL REMEDIATION DETECTION: PASS"
