name: TASK 200 - Manifest Modification

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/manifest_modification.py"
      - "tests/test_manifest_modification.py"
      - ".github/workflows/task-200-manifest-modification.yml"

permissions:
  contents: read

jobs:
  task-200:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.manifest_modification"

      - name: Run TASK 200 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_manifest_modification.py

      - name: Live manifest modification validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import tempfile
          from pathlib import Path

          from sentinelshield.manifest_modification import (
              modify_manifest,
              validate_manifest_modification,
          )

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              manifest = root / "requirements.txt"

              manifest.write_text(
                  "requests==2.31.0\nurllib3==2.0.7\n",
                  encoding="utf-8",
              )

              result = modify_manifest(
                  repository_root=root,
                  manifest=manifest,
                  dependency="requests",
                  new_value="==2.32.5",
              )

              if not validate_manifest_modification(result):
                  raise SystemExit(
                      "TASK 200 FAIL: result validation failed"
                  )

              content = manifest.read_text(encoding="utf-8")

              if content != (
                  "requests==2.32.5\n"
                  "urllib3==2.0.7\n"
              ):
                  raise SystemExit(
                      "TASK 200 FAIL: unexpected manifest modification"
                  )

              print("TASK 200 PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 200 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi

          echo "TASK 200 PASS: no bytecode changes"
