name: TASK 187 - Least Privilege Enforcement

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-187:
    name: Least Privilege Enforcement
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run TASK 187 unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_least_privilege_enforcement.py

      - name: Live least privilege validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.least_privilege_enforcement import (
              validate_current_least_privilege,
          )

          result = validate_current_least_privilege()

          print("TASK 187 identity UID:", result.identity.uid)
          print("TASK 187 identity GID:", result.identity.gid)
          print("TASK 187 allowed:", result.allowed)
          print("TASK 187 failures:", result.failures)

          if not result.allowed:
              raise SystemExit(
                  "TASK 187 FAIL: GitHub Actions runner "
                  "does not satisfy least-privilege policy"
              )

          if result.identity.uid == 0:
              raise SystemExit(
                  "TASK 187 FAIL: workflow runner is root"
              )

          print("TASK 187 PASS: least privilege enforced")
          PY

      - name: Verify no Python bytecode changes
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 187 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

          echo "TASK 187 PASS: no Python bytecode changes detected"

      - name: Final TASK 187 status
        run: |
          echo "========================================"
          echo "TASK 187 - LEAST PRIVILEGE ENFORCEMENT"
          echo "STATUS: PASS"
          echo "========================================"
