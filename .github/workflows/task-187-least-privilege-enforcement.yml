name: Task 187 - Least Privilege Enforcement

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-187:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify source import path
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield"

      - name: Run Task 187 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_least_privilege_enforcement.py

      - name: Live least-privilege validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.least_privilege_enforcement import (
              validate_current_least_privilege,
          )

          result = validate_current_least_privilege()

          print("=== TASK 187 LIVE VALIDATION ===")
          print("allowed:", result.allowed)
          print("uid:", result.uid)
          print("gid:", result.gid)
          print("is_root:", result.is_root)
          print("reason:", result.reason)

          if result.identity is None:
              raise RuntimeError("TASK 187 FAIL: execution identity unavailable")

          if result.is_root:
              raise RuntimeError(
                  "TASK 187 FAIL: GitHub Actions execution is running as root"
              )

          if not result.allowed:
              raise RuntimeError(
                  f"TASK 187 FAIL: least-privilege policy rejected runner: "
                  f"{result.reason}"
              )

          print("TASK 187 PASS: least privilege enforced")
          PY

      - name: Verify no Python bytecode changes
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 187 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

          echo "TASK 187 PASS: no Python bytecode changes"

      - name: Final status
        run: |
          echo "TASK 187 GitHub Actions validation completed"
