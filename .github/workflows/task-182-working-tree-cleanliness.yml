name: Task 182 Server Validation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-182:
    name: Task 182 Working Tree Cleanliness
    runs-on: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify Task 182 source exists
        run: |
          test -f src/sentinelshield/working_tree_cleanliness.py
          test -f tests/test_working_tree_cleanliness.py

      - name: Run Task 182 unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m pytest \
            tests/test_working_tree_cleanliness.py \
            -q

      - name: Task 182 Server Validation
        run: |
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          import os
          from pathlib import Path

          from sentinelshield.working_tree_cleanliness import (
              evaluate_working_tree_cleanliness,
          )

          root = Path.cwd()

          result = evaluate_working_tree_cleanliness(root)

          print("=== TASK 182 — WORKING TREE CLEANLINESS ===")
          print(f"valid: {result.valid}")
          print(f"repository_root: {result.repository_root}")
          print(f"clean: {result.clean}")
          print(f"changed: {result.changed}")
          print(f"change_count: {len(result.changes)}")
          print(f"reason: {result.reason}")

          for change in result.changes:
              print(
                  f"CHANGE: {change.status!r} {change.path!r}"
              )

          if not result.valid:
              raise SystemExit(
                  f"TASK 182 FAIL: {result.reason}"
              )

          if not result.clean:
              raise SystemExit(
                  "TASK 182 FAIL: working tree is not clean"
              )

          print("TASK 182 PASS: working tree is clean")
          PY

      - name: Verify no Python bytecode was generated
        run: |
          if find src tests -type f \( -name "*.pyc" -o -name "*.pyo" \) -print -quit | grep -q .; then
            echo "TASK 182 FAIL: Python bytecode was generated"
            find src tests -type f \( -name "*.pyc" -o -name "*.pyo" \) -print
            exit 1
          fi

          echo "No Python bytecode generated."
