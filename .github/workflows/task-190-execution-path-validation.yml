name: Task 190 - Path Validation Execution

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-190:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify source import path
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.execution_path_validation"

      - name: Run Task 190 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_execution_path_validation.py

      - name: Live execution-path security validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import tempfile
          from pathlib import Path

          from sentinelshield.execution_path_validation import (
              validate_execution_path,
          )

          print("=== TASK 190 LIVE VALIDATION ===")

          with tempfile.TemporaryDirectory() as root:
              root_path = Path(root)
              workspace = root_path / "execution-workspace"
              outside = root_path / "outside"

              workspace.mkdir()
              outside.mkdir()

              safe = validate_execution_path(
                  workspace,
                  "project/input.txt",
              )

              print("safe:", safe.to_dict())

              if not safe.allowed:
                  raise RuntimeError(
                      f"TASK 190 FAIL: safe path rejected: {safe.reason}"
                  )

              escaped = validate_execution_path(
                  workspace,
                  outside,
              )

              print("outside:", escaped.to_dict())

              if escaped.allowed:
                  raise RuntimeError(
                      "TASK 190 FAIL: workspace-external path accepted"
                  )

              traversal = validate_execution_path(
                  workspace,
                  "../outside",
              )

              print("traversal:", traversal.to_dict())

              if traversal.allowed:
                  raise RuntimeError(
                      "TASK 190 FAIL: traversal path accepted"
                  )

              symlink = workspace / "escape"
              symlink.symlink_to(
                  outside,
                  target_is_directory=True,
              )

              escaped_symlink = validate_execution_path(
                  workspace,
                  symlink,
              )

              print(
                  "symlink escape:",
                  escaped_symlink.to_dict(),
              )

              if escaped_symlink.allowed:
                  raise RuntimeError(
                      "TASK 190 FAIL: symlink workspace escape accepted"
                  )

          print("TASK 190 PASS: execution paths safely validated")
          PY

      - name: Verify no Python bytecode changes
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 190 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

          echo "TASK 190 PASS: no Python bytecode changes"

      - name: Final repository status
        run: |
          git status --short
          echo "TASK 190 GitHub Actions validation completed"
