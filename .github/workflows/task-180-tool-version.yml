name: TASK 180 - Tool Version Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-180:
    name: TASK 180 - Tool Version Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pytest on GitHub runner
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest

      # ======================================================
      # TASK 180 — REAL SERVER EXECUTION
      # ======================================================

      - name: Validate tool versions
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TASK 180 — TOOL VERSION VALIDATION"
          echo "EXECUTION ENVIRONMENT: GITHUB ACTIONS SERVER"
          echo "=================================================="

          echo
          echo "--- Runtime versions supplied by runner ---"

          python3 --version
          node --version
          npm --version
          git --version

          echo
          echo "--- Executable locations ---"

          command -v python3
          command -v node
          command -v npm
          command -v git

          echo
          echo "--- SentinelShield Task 180 ---"

          export PYTHONPATH="${GITHUB_WORKSPACE}/src"

          python3 \
            scripts/task_180_validate_tool_versions.py

      # ======================================================
      # TASK 180 — TESTS
      # ======================================================

      - name: Run Task 180 tests
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="${GITHUB_WORKSPACE}/src"

          python3 -m pytest \
            tests/test_tool_version_validation.py \
            -q

      # ======================================================
      # EVIDENCE
      # ======================================================

      - name: Generate Task 180 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/task-180

          {
            echo "TASK=180"
            echo "NAME=Tool Version Validation"
            echo "EXECUTION_ENVIRONMENT=GitHub Actions"
            echo "RUNNER_OS=${RUNNER_OS}"
            echo "RUNNER_ARCH=${RUNNER_ARCH}"
            echo "PYTHON_VERSION=$(python3 --version)"
            echo "NODE_VERSION=$(node --version)"
            echo "NPM_VERSION=$(npm --version)"
            echo "GIT_VERSION=$(git --version)"
            echo "PYTHON_PATH=$(command -v python3)"
            echo "NODE_PATH=$(command -v node)"
            echo "NPM_PATH=$(command -v npm)"
            echo "GIT_PATH=$(command -v git)"
            echo "JOB_STATUS=${{ job.status }}"
          } > artifacts/task-180/execution-evidence.txt

          cat artifacts/task-180/execution-evidence.txt

      - name: Upload Task 180 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-180-tool-version-evidence
          path: artifacts/task-180/
