name: TASK 195 - Emergency Stop Readiness

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/emergency_stop_readiness.py"
      - "tests/test_emergency_stop_readiness.py"
      - ".github/workflows/task-195-emergency-stop-readiness.yml"

permissions:
  contents: read

jobs:
  task-195:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.emergency_stop_readiness"

      - name: Run TASK 195 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_emergency_stop_readiness.py

      - name: Live emergency-stop readiness validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.emergency_stop_readiness import (
              EmergencyStopController,
              EmergencyStopError,
              validate_emergency_stop_readiness,
          )

          callback_calls = []

          def callback():
              callback_calls.append(True)

          controller = EmergencyStopController(callback)

          result = validate_emergency_stop_readiness(controller)

          if not result.ready:
              raise SystemExit(
                  "TASK 195 FAIL: emergency-stop controller is not ready"
              )

          if result.stopped:
              raise SystemExit(
                  "TASK 195 FAIL: controller unexpectedly stopped"
              )

          if callback_calls:
              raise SystemExit(
                  "TASK 195 FAIL: readiness check executed callback"
              )

          controller.request_stop()

          stopped = validate_emergency_stop_readiness(controller)

          if stopped.ready:
              raise SystemExit(
                  "TASK 195 FAIL: active emergency stop reported ready"
              )

          if not stopped.stopped:
              raise SystemExit(
                  "TASK 195 FAIL: stop state was not recorded"
              )

          try:
              controller.require_ready()
          except EmergencyStopError:
              pass
          else:
              raise SystemExit(
                  "TASK 195 FAIL: stopped controller passed readiness gate"
              )

          print("TASK 195 PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 195 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi

          echo "TASK 195 PASS: no bytecode changes"
