name: TASK 195 - Emergency Stop Readiness

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/emergency_stop_readiness.py"
      - "tests/test_emergency_stop_readiness.py"
      - ".github/workflows/task-195-emergency-stop-readiness.yml"

permissions:
  contents: read

jobs:
  task-195:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.emergency_stop_readiness"

      - name: Run TASK 195 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_emergency_stop_readiness.py

      - name: Live emergency-stop validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.emergency_stop_readiness import (
              EmergencyStopError,
              EmergencyStopState,
              create_emergency_stop_controller,
              require_execution_allowed,
              validate_emergency_stop_readiness,
          )

          controller = create_emergency_stop_controller()

          ready = validate_emergency_stop_readiness(controller)

          if ready.state != EmergencyStopState.READY:
              raise SystemExit(
                  "TASK 195 FAIL: controller is not READY"
              )

          require_execution_allowed(controller)

          stopped = controller.request_stop(
              "live safety validation"
          )

          if stopped.state != EmergencyStopState.STOP_REQUESTED:
              raise SystemExit(
                  "TASK 195 FAIL: stop request was not recorded"
              )

          if not stopped.stop_requested:
              raise SystemExit(
                  "TASK 195 FAIL: stop flag missing"
              )

          try:
              require_execution_allowed(controller)
          except EmergencyStopError:
              pass
          else:
              raise SystemExit(
                  "TASK 195 FAIL: execution was not blocked"
              )

          confirmed = controller.confirm_stopped()

          if confirmed.state != EmergencyStopState.STOPPED:
              raise SystemExit(
                  "TASK 195 FAIL: STOPPED state not reached"
              )

          if not confirmed.stopped:
              raise SystemExit(
                  "TASK 195 FAIL: stopped flag missing"
              )

          print("TASK 195 PASS")

          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 195 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi

          echo "TASK 195 PASS: no bytecode changes"
