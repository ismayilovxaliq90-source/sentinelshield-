name: TASK 191 - Environment Variable Validation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-191:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Export PYTHONPATH
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield"

      - name: Run TASK 191 tests
        run: |
          python -m pytest -q tests/test_environment_variable_validation.py

      - name: Live security validation
        run: |
          python - <<'PY'
          from sentinelshield.environment_variable_validation import (
              EnvironmentVariablePolicy,
              validate_environment_variables,
          )

          safe = frozenset({
              "PATH",
              "HOME",
              "LANG",
              "LC_ALL",
              "PYTHONUNBUFFERED",
          })

          policy = EnvironmentVariablePolicy(
              allowed_names=safe,
              required_names=frozenset({"PATH"}),
          )

          valid = validate_environment_variables(
              {
                  "PATH": "/usr/bin",
                  "HOME": "/home/runner",
              },
              policy,
          )

          assert valid.valid
          assert valid.failures == ()

          rejected = validate_environment_variables(
              {
                  "PATH": "/usr/bin",
                  "EVIL": "command",
              },
              policy,
          )

          assert not rejected.valid
          assert "VARIABLE_NOT_ALLOWED" in rejected.failures

          secret = validate_environment_variables(
              {
                  "PATH": "/usr/bin",
                  "API_TOKEN": "do-not-expose",
              },
              EnvironmentVariablePolicy(
                  allowed_names=frozenset({
                      "PATH",
                      "API_TOKEN",
                  }),
              ),
          )

          assert not secret.valid
          assert "SECRET_LIKE_VARIABLE_REJECTED" in secret.failures

          control = validate_environment_variables(
              {
                  "PATH": "/usr/bin\nmalicious",
              },
              policy,
          )

          assert not control.valid
          assert "CONTROL_CHARACTER_IN_VALUE" in control.failures

          print("TASK 191 LIVE VALIDATION: PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"
          if [ -n "$changed" ]; then
            echo "TASK 191 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi
          echo "TASK 191 BYTECODE CHECK: PASS"

      - name: Final repository status
        run: |
          git status --short
