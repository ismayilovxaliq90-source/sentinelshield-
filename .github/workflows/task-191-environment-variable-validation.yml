name: TASK 191 - Environment Variable Validation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-191:
    name: Validate environment variables
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Verify source import path
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.environment_variable_validation"

      - name: Run TASK 191 unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_environment_variable_validation.py

      - name: Run TASK 191 security validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.environment_variable_validation import (
              EnvironmentVariablePolicy,
              EnvironmentVariableValidationError,
              require_valid_environment,
              validate_environment_variables,
          )

          policy = EnvironmentVariablePolicy(
              allowed_names=frozenset({"PATH", "HOME", "LANG"}),
              required_names=frozenset({"PATH"}),
          )

          valid = validate_environment_variables(
              {
                  "PATH": "/usr/bin",
                  "HOME": "/home/runner",
                  "LANG": "C.UTF-8",
              },
              policy,
          )

          assert valid.valid is True
          assert valid.failures == ()
          assert valid.environment["PATH"] == "/usr/bin"

          unknown = validate_environment_variables(
              {
                  "PATH": "/usr/bin",
                  "UNTRUSTED": "value",
              },
              policy,
          )

          assert unknown.valid is False
          assert "VARIABLE_NOT_ALLOWLISTED:UNTRUSTED" in unknown.failures

          secret_policy = EnvironmentVariablePolicy(
              allowed_names=frozenset({"PATH", "API_TOKEN"}),
          )

          secret = validate_environment_variables(
              {
                  "PATH": "/usr/bin",
                  "API_TOKEN": "should-not-pass",
              },
              secret_policy,
          )

          assert secret.valid is False
          assert "SECRET_VARIABLE_REJECTED:API_TOKEN" in secret.failures

          try:
              require_valid_environment(
                  {"UNTRUSTED": "value"},
                  policy,
              )
          except EnvironmentVariableValidationError:
              pass
          else:
              raise AssertionError(
                  "Invalid environment was accepted by require_valid_environment"
              )

          print("TASK 191 PASS")
          PY

      - name: Verify no Python bytecode changes were produced
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 191 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

      - name: Final TASK 191 status
        run: |
          echo "TASK 191 - Environment Variable Validation"
          echo "STATUS: PASS"
