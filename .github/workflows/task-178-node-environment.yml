name: TASK 178 - Node Environment Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-178:
    name: TASK 178 - Node Environment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Python is required only to run the SentinelShield
      # validation/test code on the GitHub runner.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Node is installed and executed ONLY on GitHub runner.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Install pytest ONLY on the GitHub runner.
      - name: Install test dependency
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest

      # ======================================================
      # TASK 178 REAL EXECUTION
      # ======================================================
      - name: Validate Node environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== TASK 178 — SERVER EXECUTION ==="

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Node executable:"
          command -v node

          echo "npm executable:"
          command -v npm

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python scripts/task_178_validate_node_environment.py

      # ======================================================
      # TASK 178 UNIT TESTS
      # ======================================================
      - name: Run Task 178 unit tests
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -m pytest \
            tests/test_node_environment_validation.py \
            -q

      # ======================================================
      # EVIDENCE
      # ======================================================
      - name: Generate Task 178 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/task-178

          {
            echo "TASK=178"
            echo "NAME=Node Environment Validation"
            echo "EXECUTION_ENVIRONMENT=GitHub Actions"
            echo "RUNNER_OS=$RUNNER_OS"
            echo "NODE_VERSION=$(node --version)"
            echo "NPM_VERSION=$(npm --version)"
            echo "NODE_PATH=$(command -v node)"
            echo "NPM_PATH=$(command -v npm)"
            echo "JOB_STATUS=${{ job.status }}"
          } > artifacts/task-178/execution-evidence.txt

          cat artifacts/task-178/execution-evidence.txt

      - name: Upload Task 178 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-178-node-environment-evidence
          path: artifacts/task-178/
