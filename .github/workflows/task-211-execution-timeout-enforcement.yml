name: TASK 211 - Execution Timeout Enforcement

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-211:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify project layout
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/src/sentinelshield"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/execution_timeout_enforcement.py"
          test -f "$GITHUB_WORKSPACE/tests/test_execution_timeout_enforcement.py"

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -c "import sentinelshield; print(sentinelshield.__file__)"
          python -c "from sentinelshield.execution_timeout_enforcement import enforce_execution_timeout"

      - name: Install pytest
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest

      - name: Run TASK 211 unit tests
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -m pytest \
            -q \
            "$GITHUB_WORKSPACE/tests/test_execution_timeout_enforcement.py"

      - name: Live timeout validation
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          from sentinelshield.execution_timeout_enforcement import (
              enforce_execution_timeout,
              validate_timeout_result,
          )

          with tempfile.TemporaryDirectory(
              prefix="sentinelshield-task-211-"
          ) as directory:
              root = Path(directory)

              result = enforce_execution_timeout(
                  [
                      sys.executable,
                      "-c",
                      "import time; time.sleep(10)",
                  ],
                  timeout_seconds=0.25,
                  working_directory=root,
              )

              print("timed_out:", result.timed_out)
              print("return_code:", result.return_code)
              print("duration_seconds:", result.duration_seconds)
              print("stderr:", result.stderr)

              assert result.timed_out is True
              assert result.return_code != 0
              assert result.duration_seconds < 5
              assert "timed out" in result.stderr.lower()
              assert validate_timeout_result(result)

          print("TASK 211 LIVE VALIDATION: PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          set -euo pipefail

          if git status --porcelain -- '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 211 FAIL: Python bytecode changed"
            git status --porcelain -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "TASK 211 BYTECODE CHECK: PASS"

      - name: Final status
        run: |
          echo "TASK 211 SERVER VALIDATION COMPLETE"
