name: TASK 199 - Dependency Update Execution

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/dependency_update_execution.py"
      - "tests/test_dependency_update_execution.py"
      - ".github/workflows/task-199-dependency-update-execution.yml"

permissions:
  contents: read

jobs:
  task-199:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify Task 199 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_dependency_update_execution.py

      - name: Live successful execution validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import sys
          import tempfile

          from sentinelshield.dependency_update_execution import (
              execute_dependency_update,
          )

          with tempfile.TemporaryDirectory() as workspace:
              result = execute_dependency_update(
                  [sys.executable, "-c", "print('TASK 199 LIVE PASS')"],
                  workspace,
              )

          if not result.success:
              print("TASK 199 LIVE FAIL")
              print(result.to_dict())
              raise SystemExit(1)

          if "TASK 199 LIVE PASS" not in result.stdout:
              print("TASK 199 LIVE FAIL: expected output missing")
              print(result.to_dict())
              raise SystemExit(1)

          print("TASK 199 LIVE PASS")
          print(result.to_dict())
          PY

      - name: Live timeout validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import sys
          import tempfile

          from sentinelshield.dependency_update_execution import (
              DependencyUpdatePolicy,
              execute_dependency_update,
          )

          with tempfile.TemporaryDirectory() as workspace:
              result = execute_dependency_update(
                  [
                      sys.executable,
                      "-c",
                      "import time; time.sleep(5)",
                  ],
                  workspace,
                  policy=DependencyUpdatePolicy(timeout_seconds=0.2),
              )

          if result.success:
              print("TASK 199 TIMEOUT FAIL: command unexpectedly succeeded")
              print(result.to_dict())
              raise SystemExit(1)

          if not result.timed_out:
              print("TASK 199 TIMEOUT FAIL: timeout was not detected")
              print(result.to_dict())
              raise SystemExit(1)

          if result.failure_reason != "TIMEOUT":
              print("TASK 199 TIMEOUT FAIL: wrong failure reason")
              print(result.to_dict())
              raise SystemExit(1)

          print("TASK 199 TIMEOUT PASS")
          print(result.to_dict())
          PY

      - name: Verify no Python bytecode changes
        run: |
          changes="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changes" ]; then
            echo "TASK 199 FAIL: Python bytecode changes detected"
            printf '%s\n' "$changes"
            exit 1
          fi

          echo "TASK 199 BYTECODE CHECK PASS"
