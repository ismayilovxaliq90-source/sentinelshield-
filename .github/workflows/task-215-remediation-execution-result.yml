name: TASK 215 - Remediation Execution Result

on:
  push:
    paths:
      - "src/sentinelshield/remediation_execution_result.py"
      - "tests/test_remediation_execution_result.py"
      - ".github/workflows/task-215-remediation-execution-result.yml"
  pull_request:
    paths:
      - "src/sentinelshield/remediation_execution_result.py"
      - "tests/test_remediation_execution_result.py"
      - ".github/workflows/task-215-remediation-execution-result.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  task-215:
    name: TASK 215 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f src/sentinelshield/remediation_execution_result.py
          test -f tests/test_remediation_execution_result.py

      - name: Syntax validation
        run: |
          python -B - <<'PY'
          import ast
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])

          files = [
              root / "src/sentinelshield/remediation_execution_result.py",
              root / "tests/test_remediation_execution_result.py",
          ]

          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )
              print(f"SYNTAX OK: {path}")

          print("TASK 215 syntax validation: PASS")
          PY

      - name: Import validation
        run: |
          python -B - <<'PY'
          import sentinelshield
          import sentinelshield.remediation_execution_result as module

          required = [
              "RemediationExecutionResultError",
              "ExecutionResultState",
              "RemediationExecutionResult",
              "create_remediation_execution_result",
              "validate_remediation_execution_result",
          ]

          missing = [
              name
              for name in required
              if not hasattr(module, name)
          ]

          if missing:
              raise RuntimeError(
                  f"Missing TASK 215 API: {missing}"
              )

          print("TASK 215 import validation: PASS")
          PY

      - name: Install pytest
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Run TASK 215 tests
        run: |
          python -B -m pytest -q \
            tests/test_remediation_execution_result.py

      - name: Live SUCCESS result validation
        run: |
          python -B - <<'PY'
          from sentinelshield.remediation_execution_result import (
              ExecutionResultState,
              create_remediation_execution_result,
          )

          result = create_remediation_execution_result(
              return_code=0,
              expected_changes=[
                  "package.json",
                  "package-lock.json",
              ],
              actual_changes=[
                  "package.json",
                  "package-lock.json",
              ],
          )

          assert result.state is ExecutionResultState.SUCCESS
          assert result.succeeded is True
          assert result.failed is False
          assert result.missing_changes == frozenset()

          print("LIVE SUCCESS RESULT CHECK: PASS")
          PY

      - name: Live PARTIAL result validation
        run: |
          python -B - <<'PY'
          from sentinelshield.remediation_execution_result import (
              ExecutionResultState,
              create_remediation_execution_result,
          )

          result = create_remediation_execution_result(
              return_code=1,
              expected_changes=[
                  "package.json",
                  "package-lock.json",
              ],
              actual_changes=[
                  "package.json",
              ],
              failure_category="NON_ZERO_EXIT",
          )

          assert result.state is ExecutionResultState.PARTIAL
          assert result.is_partial is True
          assert result.applied_changes == {"package.json"}
          assert result.missing_changes == {"package-lock.json"}

          print("LIVE PARTIAL RESULT CHECK: PASS")
          PY

      - name: Live TIMEOUT result validation
        run: |
          python -B - <<'PY'
          from sentinelshield.remediation_execution_result import (
              ExecutionResultState,
              create_remediation_execution_result,
          )

          result = create_remediation_execution_result(
              return_code=-15,
              expected_changes=["package.json"],
              actual_changes=[],
              failure_category="TIMEOUT",
              timed_out=True,
          )

          assert result.state is ExecutionResultState.TIMEOUT
          assert result.timed_out is True
          assert result.failed is True

          print("LIVE TIMEOUT RESULT CHECK: PASS")
          PY

      - name: Live UNEXPECTED CHANGE validation
        run: |
          python -B - <<'PY'
          from sentinelshield.remediation_execution_result import (
              ExecutionResultState,
              create_remediation_execution_result,
          )

          result = create_remediation_execution_result(
              return_code=1,
              expected_changes=["package.json"],
              actual_changes=[
                  "package.json",
                  "unexpected.txt",
              ],
              failure_category="UNEXPECTED_CHANGE",
          )

          assert result.state is ExecutionResultState.UNEXPECTED_CHANGE
          assert result.unexpected_changes == {"unexpected.txt"}
          assert result.failed is True
          assert result.requires_recovery is True

          print("LIVE UNEXPECTED CHANGE CHECK: PASS")
          PY

      - name: Bytecode protection check
        run: |
          if git status --porcelain -- '*.pyc' '*.pyo' | grep -q .; then
            echo "Unexpected Python bytecode changes detected."
            git status --porcelain -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "BYTECODE PROTECTION: PASS"

      - name: Final status
        run: |
          echo "TASK 215 - REMEDIATION EXECUTION RESULT: PASS"
