name: Dependency Vulnerability Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * *'   # hər gün saat 03:00-da
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  python-deps:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    if: hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/poetry.lock') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
          pip-audit -r requirements.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  node-deps:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    if: hashFiles('**/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        run: |
          npm audit --json > npm-audit-report.json || true
          npm audit --audit-level=high

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile', '**/docker-compose*.yml') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t local/scan-target:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'local/scan-target:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [ 'python', 'javascript' ]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  summary:
    name: Aggregate & Fail-Gate
    needs: [ python-deps, node-deps, container-scan, codeql ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "python-deps: ${{ needs.python-deps.result }}"
          echo "node-deps: ${{ needs.node-deps.result }}"
          echo "container-scan: ${{ needs.container-scan.result }}"
          echo "codeql: ${{ needs.codeql.result }}"
          if [[ "${{ needs.container-scan.result }}" == "failure" ]]; then
            echo "::error::Critical/High vulnerabilities found in container image."
            exit 1
          fi
