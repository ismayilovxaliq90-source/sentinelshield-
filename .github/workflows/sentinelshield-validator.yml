name: SentinelShield Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      task:
        description: "Task number (example: 176)"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  sentinelshield:
    name: SentinelShield Validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repository
        run: |
          echo "======================================"
          echo " SENTINELSHIELD VALIDATION"
          echo "======================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit:     $GITHUB_SHA"
          echo "Task:       ${{ github.event.inputs.task || 'all' }}"
          echo "Environment: GitHub Actions Cloud"
          echo

      - name: Install project
        shell: bash
        run: |
          set -e

          python -m venv .venv
          source .venv/bin/activate

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

          if [ -f pyproject.toml ]; then
            pip install -e .
          fi

      - name: Find SentinelShield validator
        shell: bash
        run: |
          echo "Searching for SentinelShield validator..."

          find . \
            -path './.git' -prune -o \
            -path './.venv' -prune -o \
            -type f \
            \( \
              -iname '*validator*.py' \
              -o -iname '*validation*.py' \
              -o -iname '*task*.py' \
            \) \
            -print | sort

      - name: Validate Python syntax
        run: |
          python -m compileall -q src
          echo "PASS: Python syntax"

      - name: Run project tests
        shell: bash
        run: |
          if [ -d tests ]; then
            PYTHONPATH=src pytest -q
          else
            echo "No tests directory found."
          fi

      - name: Run SentinelShield validator
        shell: bash
        run: |
          TASK="${{ github.event.inputs.task || 'all' }}"

          echo "======================================"
          echo " SENTINELSHIELD TASK VALIDATION"
          echo "======================================"
          echo "Requested task: $TASK"
          echo

          if [ -f tools/sentinelshield_validator.py ]; then
            if [ "$TASK" = "all" ]; then
              python tools/sentinelshield_validator.py
            else
              python tools/sentinelshield_validator.py "$TASK"
            fi

          elif [ -f src/sentinelshield/validator.py ]; then
            if [ "$TASK" = "all" ]; then
              python -m sentinelshield.validator
            else
              python -m sentinelshield.validator "$TASK"
            fi

          else
            echo "SentinelShield validator has not been installed yet."
            echo
            echo "Workflow structure: PASS"
            echo "Task validator: WAITING FOR IMPLEMENTATION"
          fi

      - name: Final result
        if: always()
        run: |
          echo
          echo "======================================"
          echo " SENTINELSHIELD WORKFLOW FINISHED"
          echo "======================================"
