name: TASK 213 - Execution Failure Capture

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-213:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/src/sentinelshield"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/execution_failure_capture.py"
          test -f "$GITHUB_WORKSPACE/tests/test_execution_failure_capture.py"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/execution_telemetry.py"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/execution_timeout_enforcement.py"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/resource_limit_enforcement.py"

      - name: Compile TASK 213 and dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            "$GITHUB_WORKSPACE/src/sentinelshield/execution_failure_capture.py" \
            "$GITHUB_WORKSPACE/src/sentinelshield/execution_telemetry.py" \
            "$GITHUB_WORKSPACE/src/sentinelshield/execution_timeout_enforcement.py" \
            "$GITHUB_WORKSPACE/src/sentinelshield/resource_limit_enforcement.py"

      - name: Verify imports
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -c "import sentinelshield"
          python -c "import sentinelshield.execution_failure_capture"
          python -c "import sentinelshield.execution_telemetry"
          python -c "import sentinelshield.execution_timeout_enforcement"
          python -c "import sentinelshield.resource_limit_enforcement"

          echo "TASK 213 IMPORT VALIDATION: PASS"

      - name: Install pytest
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            pytest

      - name: Run TASK 213 unit tests
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -m pytest \
            -q \
            "$GITHUB_WORKSPACE/tests/test_execution_failure_capture.py"

      - name: Live non-zero exit capture
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import subprocess
          import sys

          from sentinelshield.execution_failure_capture import (
              capture_execution_result,
              validate_execution_failure,
          )

          completed = subprocess.run(
              [
                  sys.executable,
                  "-c",
                  "import sys; sys.exit(23)",
              ],
              capture_output=True,
              text=True,
              check=False,
          )

          result = capture_execution_result(
              [
                  sys.executable,
                  "-c",
                  "import sys; sys.exit(23)",
              ],
              return_code=completed.returncode,
              stdout=completed.stdout,
              stderr=completed.stderr,
          )

          print("return_code:", result.failure.return_code)
          print("category:", result.failure.category)
          print("failed:", result.failed)

          assert completed.returncode == 23
          assert result.failure.category == "NON_ZERO_EXIT"
          assert result.failure.return_code == 23
          assert result.failed is True
          assert validate_execution_failure(result)

          print("TASK 213 LIVE NON-ZERO EXIT: PASS")
          PY

      - name: Live exception capture
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.execution_failure_capture import (
              capture_exception,
              validate_execution_failure,
          )

          try:
              raise RuntimeError(
                  "intentional TASK 213 validation failure"
              )
          except RuntimeError as error:
              result = capture_exception(
                  ["sentinelshield-test"],
                  error,
              )

          print("category:", result.failure.category)
          print(
              "exception_type:",
              result.failure.exception_type,
          )

          assert result.failure.category == "UNEXPECTED_EXCEPTION"
          assert result.failure.exception_type == "RuntimeError"
          assert result.failed is True
          assert validate_execution_failure(result)

          print("TASK 213 LIVE EXCEPTION CAPTURE: PASS")
          PY

      - name: Live secret protection
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.execution_failure_capture import (
              capture_execution_result,
          )

          secret = "super-secret-value"

          result = capture_execution_result(
              ["tool", f"--token={secret}"],
              return_code=1,
              stderr=f"password={secret}",
          )

          serialized = result.to_json()

          assert secret not in serialized
          assert "[REDACTED]" in serialized

          print("TASK 213 SECRET PROTECTION: PASS")
          PY

      - name: Verify no bytecode changes
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain -- '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 213 FAIL: Python bytecode changed"
            git status --porcelain -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "TASK 213 BYTECODE CHECK: PASS"

      - name: Final TASK 213 status
        shell: bash
        run: |
          set -euo pipefail

          echo "TASK 213 SERVER VALIDATION COMPLETE"
