name: Task 208 - Unexpected File Change Detection

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  task-208:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify SentinelShield import
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/src/sentinelshield"
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          PYTHONDONTWRITEBYTECODE=1 python -c \
            "import sentinelshield; print(sentinelshield.__file__)"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Task 208 unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q tests/test_unexpected_file_change_detection.py

      - name: Live Task 208 validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from pathlib import Path
          import tempfile

          from sentinelshield.unexpected_file_change_detection import (
              detect_unexpected_file_changes,
          )

          root = Path(tempfile.mkdtemp(prefix="task-208-"))
          import subprocess

          subprocess.run(
              ["git", "init"],
              cwd=root,
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          subprocess.run(
              ["git", "config", "user.email", "ci@example.com"],
              cwd=root,
              check=True,
          )
          subprocess.run(
              ["git", "config", "user.name", "SentinelShield CI"],
              cwd=root,
              check=True,
          )

          manifest = root / "manifest.json"
          manifest.write_text('{"version": 1}\n', encoding="utf-8")

          subprocess.run(
              ["git", "add", "."],
              cwd=root,
              check=True,
          )
          subprocess.run(
              ["git", "commit", "-m", "baseline"],
              cwd=root,
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          manifest.write_text('{"version": 2}\n', encoding="utf-8")

          result = detect_unexpected_file_changes(
              root,
              expected_changes=["manifest.json"],
          )

          assert result.valid is True
          assert result.unexpected_changes == ()
          assert result.expected_changes
          assert result.expected_changes[0].path == "manifest.json"

          unexpected = root / "unexpected.txt"
          unexpected.write_text("unexpected\n", encoding="utf-8")

          result = detect_unexpected_file_changes(
              root,
              expected_changes=["manifest.json"],
          )

          assert result.valid is True
          assert len(result.unexpected_changes) == 1
          assert result.unexpected_changes[0].path == "unexpected.txt"

          print("TASK 208 LIVE VALIDATION: PASS")
          print(result.to_json())
          PY

      - name: Verify no changed or new Python bytecode
        shell: bash
        run: |
          set -euo pipefail

          git status --porcelain=v1 --untracked-files=all \
            | grep -E '(^|/)(__pycache__/|.*\.pyc$)' \
            && {
              echo "TASK 208 FAIL: Python bytecode changed or created"
              exit 1
            } || true

      - name: Final Git status
        run: |
          git status --short
