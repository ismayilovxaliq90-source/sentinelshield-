name: TASK 212 - Resource Limit Enforcement

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-212:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify project layout and import
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/src/sentinelshield"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/resource_limit_enforcement.py"
          test -f "$GITHUB_WORKSPACE/tests/test_resource_limit_enforcement.py"

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -c "import sentinelshield; print(sentinelshield.__file__)"
          python -c "from sentinelshield.resource_limit_enforcement import enforce_resource_limits"

      - name: Install pytest
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest

      - name: Run TASK 212 unit tests
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -m pytest \
            -q \
            "$GITHUB_WORKSPACE/tests/test_resource_limit_enforcement.py"

      - name: Live resource-limit validation
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          from sentinelshield.resource_limit_enforcement import (
              ResourceLimits,
              enforce_resource_limits,
              validate_resource_limit_result,
          )

          with tempfile.TemporaryDirectory(
              prefix="sentinelshield-task-212-"
          ) as directory:
              root = Path(directory)

              result = enforce_resource_limits(
                  [
                      sys.executable,
                      "-c",
                      "x=[]\n"
                      "while True:\n"
                      "    x.append('x' * 1024 * 1024)\n",
                  ],
                  limits=ResourceLimits(
                      max_cpu_seconds=30,
                      max_memory_mb=64,
                      max_processes=10,
                  ),
                  working_directory=root,
                  poll_interval=0.05,
              )

              print("return_code:", result.return_code)
              print("limit_exceeded:", result.limit_exceeded)
              print("exceeded_limits:", result.exceeded_limits)
              print("terminated:", result.terminated)
              print("memory_mb:", result.usage.memory_mb)

              assert result.limit_exceeded is True
              assert result.terminated is True
              assert "MEMORY" in result.exceeded_limits
              assert validate_resource_limit_result(result)

          print("TASK 212 LIVE VALIDATION: PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          set -euo pipefail

          if git status --porcelain -- '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 212 FAIL: Python bytecode changed"
            git status --porcelain -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "TASK 212 BYTECODE CHECK: PASS"

      - name: Final status
        run: |
          echo "TASK 212 SERVER VALIDATION COMPLETE"
