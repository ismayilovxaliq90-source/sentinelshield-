name: TASK 185 - Temporary Workspace Preparation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/temporary_workspace.py"
      - "tests/test_temporary_workspace.py"
      - ".github/workflows/task-185-temporary-workspace-preparation.yml"

permissions:
  contents: read

jobs:
  task-185:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.temporary_workspace"

      - name: Run TASK 185 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_temporary_workspace.py

      - name: Live workspace validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from sentinelshield.temporary_workspace import (
              TemporaryWorkspaceError,
              cleanup_temporary_workspace,
              prepare_temporary_workspace,
              workspace_contains,
          )

          with TemporaryDirectory() as tmp:
              base = Path(tmp)
              workspace = prepare_temporary_workspace(
                  base_dir=base,
              )

              child = workspace.path / "child.txt"
              child.write_text("temporary\n", encoding="utf-8")

              if not workspace_contains(workspace, child):
                  raise SystemExit(
                      "TASK 185 FAIL: child containment failed"
                  )

              cleanup_temporary_workspace(workspace)

              if workspace.path.exists():
                  raise SystemExit(
                      "TASK 185 FAIL: workspace was not removed"
                  )

              real = base / "real"
              real.mkdir()

              link = base / "link"
              link.symlink_to(
                  real,
                  target_is_directory=True,
              )

              try:
                  prepare_temporary_workspace(
                      base_dir=link,
                  )
              except TemporaryWorkspaceError:
                  pass
              else:
                  raise SystemExit(
                      "TASK 185 FAIL: symlink base was accepted"
                  )

          print("TASK 185 PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 185 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi

          echo "TASK 185 PASS: no bytecode changes"
