name: Task 185 - Temporary Workspace Preparation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-185:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Python import path
        run: |
          python -c "import sentinelshield; print(sentinelshield.__file__)"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Task 185 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_temporary_workspace.py

      - name: Verify all test modules can import sentinelshield
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest --collect-only -q tests

      - name: Live Task 185 validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import os
          import stat
          import tempfile

          from sentinelshield.temporary_workspace import (
              cleanup_temporary_workspace,
              prepare_temporary_workspace,
              workspace_contains,
          )

          repository = os.getcwd()

          with tempfile.TemporaryDirectory(
              prefix="task-185-base-"
          ) as base:

              workspace = prepare_temporary_workspace(
                  base_dir=base,
                  repository_root=repository,
              )

              try:
                  assert workspace.path.is_dir()
                  assert workspace.path != os.path.realpath(repository)

                  mode = stat.S_IMODE(
                      os.stat(workspace.path).st_mode
                  )
                  assert mode == 0o700

                  marker_mode = stat.S_IMODE(
                      os.stat(workspace.marker).st_mode
                  )
                  assert marker_mode == 0o600

                  test_file = (
                      workspace.path / "execution.txt"
                  )
                  test_file.write_text(
                      "server-workspace\n",
                      encoding="utf-8",
                  )

                  assert workspace_contains(
                      workspace,
                      test_file,
                  )

                  assert not workspace_contains(
                      workspace,
                      repository,
                  )

                  print("TASK 185 PASS")
                  print(
                      "workspace:",
                      workspace.path,
                  )
                  print(
                      "mode:",
                      oct(mode),
                  )
                  print(
                      "marker_mode:",
                      oct(marker_mode),
                  )

              finally:
                  cleanup_temporary_workspace(workspace)

              assert not workspace.path.exists()

          print("TASK 185 workspace cleanup: PASS")
          PY

      - name: Verify repository did not receive workspace marker
        run: |
          if find . \
            -type f \
            -name '.sentinelshield-workspace' \
            -print \
            -quit | grep -q .; then
            echo "TASK 185 FAIL: workspace marker exists inside repository"
            find . \
              -type f \
              -name '.sentinelshield-workspace' \
              -print
            exit 1
          fi

          echo "Repository isolation: PASS"

      - name: Verify Python bytecode did not change
        run: |
          if git status \
            --porcelain=v1 \
            --untracked-files=all \
            -- '*.pyc' '*.pyo' | grep -q .; then

            echo "TASK 185 FAIL: bytecode files changed or created"
            git status \
              --porcelain=v1 \
              --untracked-files=all \
              -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "Bytecode working-tree state: CLEAN"

      - name: Final repository checks
        run: |
          git diff --check
          git status --short
