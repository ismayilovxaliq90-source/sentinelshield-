name: Task 185 - Temporary Workspace Preparation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  temporary-workspace-preparation:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Task 185 unit tests
        run: |
          python -m pytest -q tests/test_temporary_workspace.py

      - name: Live workspace validation
        run: |
          python - <<'PY'
          import os
          import stat
          import tempfile

          from sentinelshield.temporary_workspace import (
              cleanup_temporary_workspace,
              prepare_temporary_workspace,
              workspace_contains,
          )

          repository = os.getcwd()

          with tempfile.TemporaryDirectory(
              prefix="task-185-validation-"
          ) as base:

              workspace = prepare_temporary_workspace(
                  base_dir=base,
                  repository_root=repository,
              )

              try:
                  assert workspace.path.is_dir()
                  assert workspace.path != os.path.realpath(repository)

                  mode = stat.S_IMODE(
                      os.stat(workspace.path).st_mode
                  )
                  assert mode == 0o700

                  assert workspace.marker.is_file()

                  test_file = workspace.path / "execution.txt"
                  test_file.write_text(
                      "server-workspace\n",
                      encoding="utf-8",
                  )

                  assert workspace_contains(
                      workspace,
                      test_file,
                  )

                  assert not workspace_contains(
                      workspace,
                      repository,
                  )

                  print("TASK 185 PASS")
                  print("workspace:", workspace.path)
                  print("base_dir:", workspace.base_dir)
                  print("mode:", oct(mode))

              finally:
                  cleanup_temporary_workspace(workspace)

              assert not workspace.path.exists()

          print("Temporary workspace cleanup: PASS")
          PY

      - name: Verify repository did not acquire temporary workspace files
        run: |
          if find . -maxdepth 2 -name '.sentinelshield-workspace' -print -quit | grep -q .; then
            echo "TASK 185 FAIL: workspace marker found inside repository"
            find . -maxdepth 2 -name '.sentinelshield-workspace' -print
            exit 1
          fi

          echo "Repository workspace isolation check: PASS"

      - name: Verify bytecode working tree state
        run: |
          if git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 185 FAIL: Python bytecode files changed or were created"
            git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "Bytecode working-tree state: CLEAN"

      - name: Final repository checks
        run: |
          git diff --check
          git status --short
