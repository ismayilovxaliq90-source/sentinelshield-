name: TASK 205 - Resolution Result Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/resolution_result_validation.py"
      - "tests/test_resolution_result_validation.py"
      - ".github/workflows/task-205-resolution-result-validation.yml"

permissions:
  contents: read

jobs:
  task-205:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Verify module import
        run: |
          python -c "import sentinelshield.resolution_result_validation"

      - name: Run TASK 205 tests
        run: |
          python -m pytest -q tests/test_resolution_result_validation.py

      - name: Run isolated live validation
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path

          from sentinelshield.resolution_result_validation import (
              ExpectedDependency,
              ResolutionResult,
              ResolutionValidationRequest,
              ResolvedDependency,
              validate_resolution_result,
          )

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary) / "fixture"
              root.mkdir()
              (root / ".git").mkdir()

              result = ResolutionResult(
                  success=True,
                  exit_code=0,
                  timed_out=False,
                  dependencies=(
                      ResolvedDependency(
                          "requests",
                          "2.32.0",
                          direct=True,
                      ),
                      ResolvedDependency(
                          "urllib3",
                          "2.2.2",
                      ),
                  ),
              )

              request = ResolutionValidationRequest(
                  repository_root=root,
                  package_manager="pip",
                  result=result,
                  expected_dependencies=(
                      ExpectedDependency("requests", ">=2.0"),
                      ExpectedDependency("urllib3", "^2.0"),
                  ),
              )

              validation = validate_resolution_result(request)

              assert validation.valid is True
              assert validation.reason == "RESOLUTION_VALID"
              assert validation.missing_dependencies == ()
              assert validation.version_mismatches == ()
              assert validation.duplicate_dependencies == ()

              print("TASK 205 LIVE VALIDATION: PASS")
          PY

      - name: Verify repository diff formatting
        run: |
          git diff --check

      - name: Verify no changed bytecode
        run: |
          if git status --porcelain | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "TASK 205 FAIL: bytecode changes detected"
            exit 1
          fi

      - name: TASK 205 PASS
        run: |
          echo "TASK 205 PASS: resolution result validation completed on GitHub runner"
