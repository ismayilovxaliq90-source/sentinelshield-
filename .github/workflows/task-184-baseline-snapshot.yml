name: Task 184 - Baseline Snapshot Creation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  baseline-snapshot:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Task 184 unit tests
        run: |
          python -m pytest -q tests/test_baseline_snapshot.py

      - name: Live baseline snapshot validation
        run: |
          python - <<'PY'
          import json
          import os
          from sentinelshield.baseline_snapshot import (
              create_baseline_snapshot,
          )

          root = os.getcwd()

          snapshot = create_baseline_snapshot(root)

          assert snapshot.repository_root
          assert snapshot.head
          assert isinstance(snapshot.files, tuple)
          assert isinstance(snapshot.status, tuple)

          payload = json.loads(snapshot.to_json())

          assert payload["repository_root"] == snapshot.repository_root
          assert payload["head"] == snapshot.head
          assert "files" in payload
          assert "status" in payload

          print("TASK 184 PASS")
          print("repository_root:", snapshot.repository_root)
          print("head:", snapshot.head)
          print("branch:", snapshot.branch)
          print("file_count:", len(snapshot.files))
          print("status_count:", len(snapshot.status))
          PY

      - name: Verify bytecode did not change
        run: |
          if git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 184 FAIL: Python bytecode files changed or were created"
            git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "Bytecode working-tree state is clean"

      - name: Verify repository state
        run: |
          git diff --check
          git status --short
