name: Task 210 - Execution Telemetry Collection

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  task-210:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify SentinelShield import
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/src/sentinelshield"
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          PYTHONDONTWRITEBYTECODE=1 python -c \
            "import sentinelshield; print(sentinelshield.__file__)"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Task 210 unit tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q \
            tests/test_execution_telemetry.py

      - name: Live Task 210 validation
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from datetime import datetime, timezone

          from sentinelshield.execution_telemetry import (
              create_execution_telemetry,
              validate_execution_telemetry,
          )

          started = datetime.now(timezone.utc).isoformat()
          completed = datetime.now(timezone.utc).isoformat()

          telemetry = create_execution_telemetry(
              execution_id="github-task-210",
              command=[
                  "npm",
                  "install",
                  "--token=super-secret-value",
              ],
              status="completed",
              started_at=started,
              completed_at=completed,
              duration_seconds=1.0,
              return_code=0,
              stdout="remediation completed",
              stderr="",
              resource_usage={
                  "cpu_seconds": 0.25,
                  "peak_rss_bytes": 1048576,
              },
              metadata={
                  "task": "210",
                  "api_token": "super-secret-value",
              },
          )

          assert validate_execution_telemetry(telemetry)
          assert telemetry.return_code == 0
          assert telemetry.stdout_bytes > 0

          serialized = telemetry.to_json()

          assert "super-secret-value" not in serialized
          assert "[REDACTED]" in serialized

          timeout_telemetry = create_execution_telemetry(
              execution_id="github-task-210-timeout",
              command=["tool"],
              status="timeout",
              started_at=started,
              completed_at=completed,
              duration_seconds=10.0,
              timed_out=True,
          )

          assert validate_execution_telemetry(
              timeout_telemetry
          )

          print("TASK 210 LIVE VALIDATION: PASS")
          print(serialized)
          PY

      - name: Verify no changed or new Python bytecode
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain=v1 --untracked-files=all \
            | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "TASK 210 FAIL: Python bytecode changed or created"
            exit 1
          fi

      - name: Final Git status
        run: |
          git status --short
