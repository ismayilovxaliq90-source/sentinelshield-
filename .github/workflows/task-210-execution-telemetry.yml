name: Task 210 - Execution Telemetry Collection

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  task-210:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify project layout
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/src/sentinelshield"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/execution_telemetry.py"
          test -f "$GITHUB_WORKSPACE/tests/test_execution_telemetry.py"

      - name: Verify SentinelShield import
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          PYTHONDONTWRITEBYTECODE=1 python -c \
            "import sentinelshield.execution_telemetry as m; print(m.__file__)"

      - name: Install pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Task 210 tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q \
            tests/test_execution_telemetry.py

      - name: Live telemetry validation
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from datetime import datetime, timezone

          from sentinelshield.execution_telemetry import (
              ExecutionTelemetryCollector,
              create_execution_telemetry,
              validate_execution_telemetry,
          )

          started = datetime.now(timezone.utc).isoformat()
          completed = datetime.now(timezone.utc).isoformat()

          telemetry = create_execution_telemetry(
              execution_id="task-210-live",
              status="completed",
              started_at=started,
              completed_at=completed,
              duration_seconds=1.0,
              command=[
                  "npm",
                  "install",
                  "--token=super-secret-value",
              ],
              return_code=0,
              stdout="remediation completed",
              stderr="",
              resource_usage={
                  "cpu_seconds": 0.25,
                  "peak_rss_bytes": 1048576,
              },
              metadata={
                  "task": 210,
                  "api_token": "super-secret-value",
              },
          )

          assert validate_execution_telemetry(telemetry)

          serialized = telemetry.to_json()

          assert "super-secret-value" not in serialized
          assert "[REDACTED]" in serialized
          assert telemetry.return_code == 0
          assert telemetry.stdout_bytes > 0
          assert telemetry.resource_usage[
              "peak_rss_bytes"
          ] == 1048576

          timeout_collector = (
              ExecutionTelemetryCollector.start(
                  execution_id="task-210-timeout",
                  command=["safe-command"],
              )
          )

          timeout_result = timeout_collector.finish(
              status="timeout",
              duration_seconds=30.0,
              timed_out=True,
          )

          assert validate_execution_telemetry(
              timeout_result
          )
          assert timeout_result.status == "timeout"

          print("TASK 210 LIVE VALIDATION: PASS")
          print(serialized)
          PY

      - name: Verify no Python bytecode changes
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain=v1 --untracked-files=all \
            | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "TASK 210 FAIL: Python bytecode changed or created"
            exit 1
          fi

      - name: Verify Task 210 files are present
        shell: bash
        run: |
          set -euo pipefail
          test -f src/sentinelshield/execution_telemetry.py
          test -f tests/test_execution_telemetry.py
          test -f .github/workflows/task-210-execution-telemetry.yml

      - name: Final status
        shell: bash
        run: |
          git status --short
