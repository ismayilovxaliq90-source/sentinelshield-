name: TASK 196 - Remediation Dry Run

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/remediation_dry_run.py"
      - "tests/test_remediation_dry_run.py"
      - ".github/workflows/task-196-remediation-dry-run.yml"

permissions:
  contents: read

jobs:
  task-196:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.remediation_dry_run"

      - name: Run TASK 196 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_remediation_dry_run.py

      - name: Live dry-run validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.remediation_dry_run import (
              RemediationDryRunError,
              prepare_remediation_dry_run,
          )

          result = prepare_remediation_dry_run(
              ("package-manager", "update", "safe-package"),
              working_directory="/tmp/task-196-workspace",
              environment={
                  "CI": "true",
              },
          )

          if not result.valid:
              raise SystemExit(
                  "TASK 196 FAIL: valid dry-run rejected"
              )

          if result.executed:
              raise SystemExit(
                  "TASK 196 FAIL: dry-run reported execution"
              )

          if result.filesystem_modified:
              raise SystemExit(
                  "TASK 196 FAIL: dry-run reported filesystem modification"
              )

          try:
              prepare_remediation_dry_run(
                  ("package-manager", "update", "safe;command"),
                  working_directory="/tmp/task-196-workspace",
              )
          except RemediationDryRunError:
              pass
          else:
              raise SystemExit(
                  "TASK 196 FAIL: shell injection accepted"
              )

          print("TASK 196 PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 196 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi

          echo "TASK 196 PASS: no bytecode changes"
