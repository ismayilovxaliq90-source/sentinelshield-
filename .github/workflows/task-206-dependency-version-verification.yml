name: TASK 206 - Dependency Version Verification

on:
  push:
    paths:
      - "src/sentinelshield/dependency_version_verification.py"
      - "tests/test_dependency_version_verification.py"
      - ".github/workflows/task-206-dependency-version-verification.yml"
  pull_request:
    paths:
      - "src/sentinelshield/dependency_version_verification.py"
      - "tests/test_dependency_version_verification.py"
      - ".github/workflows/task-206-dependency-version-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-206:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pytest
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Verify repository Python path
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/src/sentinelshield"

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 \
          python -c "import sentinelshield; print(sentinelshield.__file__)"

      - name: Run TASK 206 unit tests
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 \
          python -m pytest -q \
            "$GITHUB_WORKSPACE/tests/test_dependency_version_verification.py"

      - name: Create isolated real npm fixture
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-206-fixture"

          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"

          git init -q

          cat > package.json <<'JSON'
          {
            "name": "sentinelshield-task-206-fixture",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "is-number": "7.0.0"
            }
          }
          JSON

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Execute real TASK 206 verification
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-206-fixture"
          LIVE_CHECK="$RUNNER_TEMP/task_206_live_check.py"

          cat > "$LIVE_CHECK" <<PY
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "$GITHUB_WORKSPACE/src")

          from sentinelshield.dependency_version_verification import (
              ActualDependency,
              ExpectedDependency,
              validate_verification_result,
              verify_repository_manifest,
          )

          root = Path("$RUNNER_TEMP/task-206-fixture")
          package_json = root / "package.json"

          completed = subprocess.run(
              [
                  "npm",
                  "ls",
                  "is-number",
                  "--json",
                  "--package-lock-only",
                  "--depth=0",
              ],
              cwd=root,
              stdin=subprocess.DEVNULL,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              encoding="utf-8",
              errors="replace",
              shell=False,
              check=False,
              close_fds=True,
              timeout=60,
          )

          if completed.returncode != 0:
              print(completed.stdout)
              print(completed.stderr)
              raise SystemExit(
                  "TASK 206 FAIL: npm dependency lookup failed"
              )

          data = json.loads(completed.stdout)

          actual_version = (
              data.get("dependencies", {})
              .get("is-number", {})
              .get("version")
          )

          if actual_version is None:
              raise SystemExit(
                  "TASK 206 FAIL: actual is-number version missing"
              )

          result = verify_repository_manifest(
              repository_root=root,
              manifest_path=package_json,
              manager="npm",
              expected=(
                  ExpectedDependency(
                      name="is-number",
                      version="7.0.0",
                  ),
              ),
              actual=(
                  ActualDependency(
                      name="is-number",
                      version=actual_version,
                  ),
              ),
          )

          if not validate_verification_result(result):
              print(result.to_dict())
              raise SystemExit(
                  "TASK 206 FAIL: verification result invalid"
              )

          if not result.success:
              print(result.to_dict())
              raise SystemExit(
                  "TASK 206 FAIL: dependency version mismatch"
              )

          if actual_version != "7.0.0":
              raise SystemExit(
                  f"TASK 206 FAIL: expected 7.0.0, got {actual_version}"
              )

          print("TASK 206 PASS")
          print("package: is-number")
          print("expected: 7.0.0")
          print("actual:", actual_version)
          PY

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          PYTHONDONTWRITEBYTECODE=1 \
          python "$LIVE_CHECK"

          rm -f "$LIVE_CHECK"

      - name: Verify manifest and lockfile versions
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-206-fixture"

          test -f "$FIXTURE/package.json"
          test -f "$FIXTURE/package-lock.json"

          python - "$FIXTURE" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          package = json.loads(
              (root / "package.json").read_text(
                  encoding="utf-8"
              )
          )

          lockfile = json.loads(
              (root / "package-lock.json").read_text(
                  encoding="utf-8"
              )
          )

          expected = (
              package
              .get("dependencies", {})
              .get("is-number")
          )

          locked = (
              lockfile
              .get("packages", {})
              .get("node_modules/is-number", {})
              .get("version")
          )

          if expected != "7.0.0":
              raise SystemExit(
                  f"TASK 206 FAIL: manifest version is {expected}"
              )

          if locked != "7.0.0":
              raise SystemExit(
                  f"TASK 206 FAIL: lockfile version is {locked}"
              )

          print("manifest version:", expected)
          print("lockfile version:", locked)
          print("TASK 206 manifest/lockfile verification PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          set -euo pipefail

          if git status --porcelain=v1 | grep -E \
            '(^|[[:space:]])[^[:space:]]*\.pyc$|__pycache__'; then
            echo "TASK 206 FAIL: bytecode changes detected"
            exit 1
          fi

          echo "TASK 206 bytecode verification PASS"
