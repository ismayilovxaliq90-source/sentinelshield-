name: SentinelShield Task 181 - Repository State Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/repository_state_validation.py"
      - "tests/test_repository_state_validation.py"
      - ".github/workflows/task-181-repository-state-validation.yml"

permissions:
  contents: read

jobs:
  task-181:
    name: Task 181 Server Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Task 181 tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/test_repository_state_validation.py -q

      - name: Run live repository-state validation
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os
          from sentinelshield.repository_state_validation import (
              validate_repository_state,
          )

          repository = os.environ["GITHUB_WORKSPACE"]

          result = validate_repository_state(repository)

          print("=== TASK 181 — REPOSITORY STATE VALIDATION ===")
          print(f"valid: {result.valid}")
          print(f"repository_root: {result.repository_root}")
          print(f"git_directory: {result.git_directory}")
          print(f"head: {result.head}")
          print(f"branch: {result.branch}")
          print(f"detached_head: {result.detached_head}")
          print(f"git_version: {result.git_version}")
          print(f"reason: {result.reason}")

          if not result.valid:
              raise SystemExit(
                  "TASK 181 FAIL: repository state validation failed"
              )

          if not result.head:
              raise SystemExit(
                  "TASK 181 FAIL: HEAD was not detected"
              )

          if not result.repository_root:
              raise SystemExit(
                  "TASK 181 FAIL: repository root was not detected"
              )

          if not result.git_directory:
              raise SystemExit(
                  "TASK 181 FAIL: Git directory was not detected"
              )

          print("TASK 181 — REPOSITORY STATE VALIDATION: PASS")
          print("STATUS: VERIFIED IN GITHUB ACTIONS")
          PY

      - name: Publish Task 181 summary
        if: always()
        run: |
          {
            echo "## Task 181 — Repository State Validation"
            echo
            echo "Execution environment: GitHub Actions isolated runner"
            echo "Local WSL execution: NOT PERFORMED"
            echo "Repository state validation: completed on runner"
          } >> "$GITHUB_STEP_SUMMARY"
