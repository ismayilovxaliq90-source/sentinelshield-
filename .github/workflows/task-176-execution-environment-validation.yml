name: SentinelShield Task 176

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-176:
    name: Execution Environment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify GitHub Actions execution boundary
        shell: bash
        run: |
          test "${GITHUB_ACTIONS}" = "true"
          test "${CI}" = "true"

      - name: Run Task 176 tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest \
            tests/test_execution_environment_validation.py \
            -q

      - name: Execute Task 176 validation
        env:
          PYTHONPATH: src
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import sys

          from sentinelshield.execution_environment_validation import (
              ExecutionEnvironmentValidationInput,
              validate_execution_environment,
              write_validation_evidence,
          )

          result = validate_execution_environment(
              ExecutionEnvironmentValidationInput(
                  require_ci=True,
                  require_github_actions=True,
                  minimum_free_disk_bytes=100 * 1024 * 1024,
              )
          )

          write_validation_evidence(
              result,
              "artifacts/task176/execution_environment_validation.json",
          )

          print("=== TASK 176 — EXECUTION ENVIRONMENT VALIDATION ===")
          print(f"STATUS: {result.status}")
          print(f"ENVIRONMENT: {result.environment}")
          print(f"OS: {result.operating_system}")
          print(f"ARCHITECTURE: {result.architecture}")
          print(f"PYTHON: {result.python_version}")
          print(f"CI: {result.ci_detected}")
          print(f"GITHUB_ACTIONS: {result.github_actions_detected}")
          print(f"WORKSPACE: {result.workspace}")
          print(f"FREE_DISK_BYTES: {result.free_disk_bytes}")
          print(f"REASONS: {', '.join(result.reasons)}")
          print(f"ERRORS: {', '.join(result.errors)}")

          if not result.valid:
              sys.exit(1)
          PY

      - name: Upload Task 176 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelshield-task-176-evidence
          path: artifacts/task176/execution_environment_validation.json
          if-no-files-found: warn
