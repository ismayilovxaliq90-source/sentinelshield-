name: TASK 192 - Secret Exposure Prevention

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-192:
    name: Secret exposure validation
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Verify source import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.secret_exposure_prevention"

      - name: Run TASK 192 unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_secret_exposure_prevention.py

      - name: Run TASK 192 security validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.secret_exposure_prevention import (
              SecretExposurePolicy,
              SecretExposurePreventionError,
              inspect_secret_exposure,
              require_no_secret_exposure,
              validate_command_secret_exposure,
          )

          policy = SecretExposurePolicy(
              secret_names=frozenset({"DEPLOY_SECRET"})
          )

          clean = inspect_secret_exposure(
              "normal diagnostic output",
              policy=policy,
          )

          assert clean.safe is True
          assert clean.exposures == ()

          secret = "VERY-SENSITIVE-VALUE"

          exposed = inspect_secret_exposure(
              f"token={secret}",
              environment={
                  "DEPLOY_SECRET": secret,
              },
              policy=policy,
          )

          assert exposed.safe is False
          assert secret not in str(exposed.redacted)
          assert secret not in str(exposed.to_dict())

          command = validate_command_secret_exposure(
              (
                  "python3",
                  "-c",
                  f"print({secret})",
              ),
              environment={
                  "DEPLOY_SECRET": secret,
              },
              policy=policy,
          )

          assert command.safe is False
          assert secret not in str(command.redacted)

          try:
              require_no_secret_exposure(
                  f"secret={secret}",
                  environment={
                      "DEPLOY_SECRET": secret,
                  },
                  policy=policy,
              )
          except SecretExposurePreventionError as error:
              assert secret not in str(error)
          else:
              raise AssertionError(
                  "Secret exposure was incorrectly accepted"
              )

          print("TASK 192 PASS")
          PY

      - name: Verify no Python bytecode changes were produced
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 192 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

      - name: Final TASK 192 status
        run: |
          echo "TASK 192 - Secret Exposure Prevention"
          echo "STATUS: PASS"
