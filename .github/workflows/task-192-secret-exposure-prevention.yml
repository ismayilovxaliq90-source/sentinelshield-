name: TASK 192 - Secret Exposure Prevention

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-192:
    name: Secret Exposure Prevention
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run TASK 192 unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_secret_exposure_prevention.py

      - name: Live TASK 192 security validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.secret_exposure_prevention import (
              validate_secret_exposure,
          )

          secret = "TASK192_TEST_SECRET"

          result = validate_secret_exposure(
              ["tool", "--token", secret],
              {
                  "PATH": "/usr/bin",
                  "NORMAL": f"value-{secret}",
              },
              secret_values={secret},
          )

          if result.safe:
              raise SystemExit("TASK 192 FAIL: secret exposure was not detected")

          rendered = repr(result)

          if secret in rendered:
              raise SystemExit(
                  "TASK 192 FAIL: secret appeared in validation result"
              )

          if secret in " ".join(result.redacted_command):
              raise SystemExit(
                  "TASK 192 FAIL: secret appeared in redacted command"
              )

          if secret in str(dict(result.redacted_environment)):
              raise SystemExit(
                  "TASK 192 FAIL: secret appeared in redacted environment"
              )

          print("TASK 192 PASS: secret exposure detected and redacted safely")

          safe_result = validate_secret_exposure(
              ["git", "status"],
              {
                  "PATH": "/usr/bin",
                  "LANG": "C.UTF-8",
              },
          )

          if not safe_result.safe:
              raise SystemExit(
                  "TASK 192 FAIL: safe command/environment was rejected"
              )

          print("TASK 192 PASS: safe command/environment accepted")
          PY

      - name: Verify no Python bytecode changes
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 192 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

          echo "TASK 192 PASS: no Python bytecode changes detected"

      - name: Final TASK 192 status
        run: |
          echo "========================================"
          echo "TASK 192 - SECRET EXPOSURE PREVENTION"
          echo "STATUS: PASS"
          echo "========================================"
