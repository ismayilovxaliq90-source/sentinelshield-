name: TASK 192 - Secret Exposure Prevention

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-192:
    name: Secret Exposure Prevention
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run TASK 192 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q \
            tests/test_secret_exposure_prevention.py

      - name: Live TASK 192 security validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.secret_exposure_prevention import (
              validate_secret_exposure,
          )

          secret = "TASK192_RUNTIME_SECRET"

          result = validate_secret_exposure(
              [
                  "tool",
                  "--token",
                  secret,
              ],
              {
                  "PATH": "/usr/bin",
                  "NORMAL": f"safe-{secret}-value",
              },
              secret_values={secret},
          )

          if result.safe:
              raise SystemExit(
                  "TASK 192 FAIL: secret exposure not detected"
              )

          rendered = repr(result)

          if secret in rendered:
              raise SystemExit(
                  "TASK 192 FAIL: plaintext secret leaked "
                  "through result representation"
              )

          if secret in " ".join(
              result.redacted_command
          ):
              raise SystemExit(
                  "TASK 192 FAIL: plaintext secret leaked "
                  "through redacted command"
              )

          if secret in str(
              dict(result.redacted_environment)
          ):
              raise SystemExit(
                  "TASK 192 FAIL: plaintext secret leaked "
                  "through redacted environment"
              )

          safe = validate_secret_exposure(
              ["git", "status"],
              {
                  "PATH": "/usr/bin",
                  "LANG": "C.UTF-8",
              },
          )

          if not safe.safe:
              raise SystemExit(
                  "TASK 192 FAIL: safe input rejected"
              )

          print(
              "TASK 192 PASS: secret exposure protection validated"
          )
          PY

      - name: Verify Python bytecode did not change
        run: |
          if git status --porcelain=v1 \
              --untracked-files=all -- '*.pyc' '*.pyo' \
              | grep -q .; then
            echo "TASK 192 FAIL: Python bytecode changed"
            git status --short
            exit 1
          fi

          echo "TASK 192 PASS: no Python bytecode changes"

      - name: Final TASK 192 status
        run: |
          echo "========================================"
          echo "TASK 192 - SECRET EXPOSURE PREVENTION"
          echo "STATUS: PASS"
          echo "========================================"

git diff --check

git add \
  src/sentinelshield/secret_exposure_prevention.py \
  tests/test_secret_exposure_prevention.py \
  .github/workflows/task-192-secret-exposure-prevention.yml

git commit -m "Implement Task 192 secret exposure prevention"

git push
cd ~/Projects/sentinelshield

mkdir -p src/sentinelshield tests .github/workflows

cat > src/sentinelshield/secret_exposure_prevention.py <<'PY'
from __future__ import annotations

from dataclasses import dataclass
from typing import Mapping, Sequence
import re


class SecretExposureError(ValueError):
    """Raised when secret exposure protection cannot validate input safely."""


@dataclass(frozen=True)
class SecretExposurePolicy:
    secret_names: tuple[str, ...] = ()
    secret_values: tuple[str, ...] = ()
    redact_token: str = "[REDACTED]"
    minimum_secret_length: int = 4
    reject_command_exposure: bool = True
    reject_output_exposure: bool = True


@dataclass(frozen=True)
class SecretFinding:
    location: str
    identifier: str
    reason: str


@dataclass(frozen=True)
class SecretExposureResult:
    safe: bool
    exposed: bool
    findings: tuple[SecretFinding, ...]
    redacted_output: str

    def to_dict(self) -> dict:
        return {
            "safe": self.safe,
            "exposed": self.exposed,
            "findings": [
                {
                    "location": finding.location,
                    "identifier": finding.identifier,
                    "reason": finding.reason,
                }
                for finding in self.findings
            ],
            "redacted_output": self.redacted_output,
        }


_CONTROL_RE = re.compile(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]")


def _validate_policy(policy: SecretExposurePolicy) -> None:
    if not isinstance(policy, SecretExposurePolicy):
        raise SecretExposureError("policy must be SecretExposurePolicy")

    if not isinstance(policy.redact_token, str) or not policy.redact_token:
        raise SecretExposureError("redact_token must be non-empty string")

    if (
        not isinstance(policy.minimum_secret_length, int)
        or isinstance(policy.minimum_secret_length, bool)
        or policy.minimum_secret_length < 1
    ):
        raise SecretExposureError("minimum_secret_length must be positive integer")


def _validate_text(value: object, field: str) -> str:
    if not isinstance(value, str):
        raise SecretExposureError(f"{field} must be string")

    if _CONTROL_RE.search(value):
        raise SecretExposureError(f"{field} contains control character")

    return value


def _normalize_secrets(
    environment: Mapping[str, object] | None,
    policy: SecretExposurePolicy,
) -> tuple[tuple[str, str], ...]:
    secrets: list[tuple[str, str]] = []

    for name in policy.secret_names:
        if not isinstance(name, str) or not name:
            raise SecretExposureError("secret_names must contain non-empty strings")

    for value in policy.secret_values:
        if not isinstance(value, str):
            raise SecretExposureError("secret_values must contain strings")
        if len(value) >= policy.minimum_secret_length:
            secrets.append(("configured-secret", value))

    if environment is not None:
        if not isinstance(environment, Mapping):
            raise SecretExposureError("environment must be mapping")

        for name, value in environment.items():
            if not isinstance(name, str) or not name:
                raise SecretExposureError("environment variable name must be string")

            if not isinstance(value, str):
                raise SecretExposureError(
                    f"environment variable {name!r} must contain string value"
                )

            if name in policy.secret_names and len(value) >= policy.minimum_secret_length:
                secrets.append((name, value))

    deduplicated: dict[str, str] = {}
    for identifier, value in secrets:
        deduplicated[value] = identifier

    return tuple(
        (identifier, value)
        for value, identifier in deduplicated.items()
    )


def _redact(text: str, secrets: Sequence[tuple[str, str]], token: str) -> str:
    result = text

    ordered = sorted(
        secrets,
        key=lambda item: len(item[1]),
        reverse=True,
    )

    for _, secret in ordered:
        if secret:
            result = result.replace(secret, token)

    return result


def prevent_secret_exposure(
    *,
    command: Sequence[str] | None = None,
    environment: Mapping[str, object] | None = None,
    stdout: str = "",
    stderr: str = "",
    policy: SecretExposurePolicy | None = None,
) -> SecretExposureResult:
    policy = policy or SecretExposurePolicy()
    _validate_policy(policy)

    secrets = _normalize_secrets(environment, policy)

    findings: list[SecretFinding] = []

    command_values: list[str] = []
    if command is not None:
        if isinstance(command, (str, bytes)):
            raise SecretExposureError("command must be a sequence of strings")

        try:
            command_values = list(command)
        except TypeError as error:
            raise SecretExposureError(
                "command must be an iterable sequence"
            ) from error

        for index, argument in enumerate(command_values):
            _validate_text(argument, f"command[{index}]")

    stdout = _validate_text(stdout, "stdout")
    stderr = _validate_text(stderr, "stderr")

    if policy.reject_command_exposure:
        for identifier, secret in secrets:
            for index, argument in enumerate(command_values):
                if secret in argument:
                    findings.append(
                        SecretFinding(
                            location=f"command[{index}]",
                            identifier=identifier,
                            reason="SECRET_VALUE_IN_COMMAND",
                        )
                    )

    if policy.reject_output_exposure:
        for identifier, secret in secrets:
            if secret in stdout:
                findings.append(
                    SecretFinding(
                        location="stdout",
                        identifier=identifier,
                        reason="SECRET_VALUE_IN_OUTPUT",
                    )
                )

            if secret in stderr:
                findings.append(
                    SecretFinding(
                        location="stderr",
                        identifier=identifier,
                        reason="SECRET_VALUE_IN_OUTPUT",
                    )
                )

    redacted_stdout = _redact(stdout, secrets, policy.redact_token)
    redacted_stderr = _redact(stderr, secrets, policy.redact_token)

    redacted_output = (
        f"stdout:\n{redacted_stdout}\n"
        f"stderr:\n{redacted_stderr}"
    )

    return SecretExposureResult(
        safe=not findings,
        exposed=bool(findings),
        findings=tuple(findings),
        redacted_output=redacted_output,
    )


def require_no_secret_exposure(
    *,
    command: Sequence[str] | None = None,
    environment: Mapping[str, object] | None = None,
    stdout: str = "",
    stderr: str = "",
    policy: SecretExposurePolicy | None = None,
) -> SecretExposureResult:
    result = prevent_secret_exposure(
        command=command,
        environment=environment,
        stdout=stdout,
        stderr=stderr,
        policy=policy,
    )

    if result.exposed:
        reasons = ", ".join(
            finding.reason for finding in result.findings
        )
        raise SecretExposureError(
            f"secret exposure detected: {reasons}"
        )

    return result
PY

cat > tests/test_secret_exposure_prevention.py <<'PY'
from sentinelshield.secret_exposure_prevention import (
    SecretExposureError,
    SecretExposurePolicy,
    prevent_secret_exposure,
    require_no_secret_exposure,
)


def test_safe_command_and_output():
    result = prevent_secret_exposure(
        command=("git", "status"),
        environment={},
        stdout="clean",
        stderr="",
    )

    assert result.safe is True
    assert result.exposed is False
    assert result.findings == ()


def test_secret_in_command_is_detected():
    policy = SecretExposurePolicy(
        secret_names=("API_TOKEN",),
    )

    result = prevent_secret_exposure(
        command=("tool", "--token", "super-secret-token"),
        environment={"API_TOKEN": "super-secret-token"},
        policy=policy,
    )

    assert result.exposed is True
    assert any(
        finding.reason == "SECRET_VALUE_IN_COMMAND"
        for finding in result.findings
    )


def test_secret_in_stdout_is_detected_and_redacted():
    policy = SecretExposurePolicy(
        secret_names=("API_TOKEN",),
    )

    result = prevent_secret_exposure(
        environment={"API_TOKEN": "super-secret-token"},
        stdout="token=super-secret-token",
        policy=policy,
    )

    assert result.exposed is True
    assert "super-secret-token" not in result.redacted_output
    assert "[REDACTED]" in result.redacted_output


def test_secret_in_stderr_is_detected_and_redacted():
    policy = SecretExposurePolicy(
        secret_names=("PASSWORD",),
    )

    result = prevent_secret_exposure(
        environment={"PASSWORD": "very-secret-password"},
        stderr="authentication failed: very-secret-password",
        policy=policy,
    )

    assert result.exposed is True
    assert "very-secret-password" not in result.redacted_output


def test_configured_secret_values_are_supported():
    policy = SecretExposurePolicy(
        secret_values=("known-secret-value",),
    )

    result = prevent_secret_exposure(
        stdout="known-secret-value",
        policy=policy,
    )

    assert result.exposed is True


def test_require_no_secret_exposure_raises():
    policy = SecretExposurePolicy(
        secret_names=("TOKEN",),
    )

    try:
        require_no_secret_exposure(
            command=("tool", "secret-value"),
            environment={"TOKEN": "secret-value"},
            policy=policy,
        )
    except SecretExposureError:
        pass
    else:
        raise AssertionError("expected SecretExposureError")


def test_short_values_are_not_treated_as_secrets():
    policy = SecretExposurePolicy(
        secret_names=("TOKEN",),
        minimum_secret_length=8,
    )

    result = prevent_secret_exposure(
        command=("tool", "abc"),
        environment={"TOKEN": "abc"},
        policy=policy,
    )

    assert result.safe is True


def test_invalid_command_string_is_rejected():
    try:
        prevent_secret_exposure(command="git status")
    except SecretExposureError:
        pass
    else:
        raise AssertionError("expected SecretExposureError")


def test_control_character_is_rejected():
    try:
        prevent_secret_exposure(stdout="safe\x00secret")
    except SecretExposureError:
        pass
    else:
        raise AssertionError("expected SecretExposureError")


def test_longer_secret_is_redacted_before_shorter_overlap():
    policy = SecretExposurePolicy(
        secret_values=("secret", "super-secret"),
    )

    result = prevent_secret_exposure(
        stdout="super-secret",
        policy=policy,
    )

    assert "super-secret" not in result.redacted_output
    assert "secret" not in result.redacted_output
PY

cat > .github/workflows/task-192-secret-exposure-prevention.yml <<'YAML'
name: TASK 192 - Secret Exposure Prevention

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/secret_exposure_prevention.py"
      - "tests/test_secret_exposure_prevention.py"
      - ".github/workflows/task-192-secret-exposure-prevention.yml"

permissions:
  contents: read

jobs:
  task-192:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify Python import path
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.secret_exposure_prevention"

      - name: Run TASK 192 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_secret_exposure_prevention.py

      - name: Live secret exposure validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.secret_exposure_prevention import (
              SecretExposurePolicy,
              prevent_secret_exposure,
          )

          policy = SecretExposurePolicy(
              secret_names=("CI_TOKEN",),
          )

          result = prevent_secret_exposure(
              command=("safe-tool", "--mode", "check"),
              environment={"CI_TOKEN": "runner-secret-value"},
              stdout="operation completed successfully",
              stderr="",
              policy=policy,
          )

          if not result.safe:
              raise SystemExit("TASK 192 FAIL: safe execution was classified as exposed")

          exposed = prevent_secret_exposure(
              command=("safe-tool", "--token", "runner-secret-value"),
              environment={"CI_TOKEN": "runner-secret-value"},
              stdout="",
              stderr="",
              policy=policy,
          )

          if not exposed.exposed:
              raise SystemExit("TASK 192 FAIL: command secret exposure was not detected")

          if "runner-secret-value" in exposed.redacted_output:
              raise SystemExit("TASK 192 FAIL: secret remained in redacted output")

          print("TASK 192 PASS")
          PY

      - name: Verify no bytecode changes were created
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 192 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi

          echo "TASK 192 PASS: no bytecode changes"
