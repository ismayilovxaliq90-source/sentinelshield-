name: Task 217 - Manifest Diff Analysis

on:
  push:
    paths:
      - "src/sentinelshield/manifest_diff_analysis.py"
      - "tests/test_manifest_diff_analysis.py"
      - ".github/workflows/task-217-manifest-diff-analysis.yml"
  pull_request:
    paths:
      - "src/sentinelshield/manifest_diff_analysis.py"
      - "tests/test_manifest_diff_analysis.py"
      - ".github/workflows/task-217-manifest-diff-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  task-217:
    name: Task 217 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          python --version
          git --version

          test -f src/sentinelshield/manifest_diff_analysis.py
          test -f tests/test_manifest_diff_analysis.py

          echo "TASK 217 environment validation: PASS"

      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import ast
          from pathlib import Path

          targets = (
              Path("src/sentinelshield/manifest_diff_analysis.py"),
              Path("tests/test_manifest_diff_analysis.py"),
          )

          for target in targets:
              source = target.read_text(
                  encoding="utf-8"
              )
              ast.parse(
                  source,
                  filename=str(target),
              )
              print(f"SYNTAX PASS: {target}")

          print("TASK 217 syntax validation: PASS")
          PY

      - name: Import validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import sentinelshield.manifest_diff_analysis as module

          required = (
              "ManifestDependencyChange",
              "ManifestDiff",
              "ManifestDiffAnalysisError",
              "ManifestDiffAnalysisResult",
              "analyze_manifest_diff",
              "analyze_manifest_diffs",
              "validate_manifest_diff_analysis",
          )

          for name in required:
              assert hasattr(module, name), (
                  f"Missing public API: {name}"
              )

          print("TASK 217 import/API validation: PASS")
          PY

      - name: Install pytest
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            pytest

      - name: Run Task 217 tests
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B -m pytest \
            tests/test_manifest_diff_analysis.py \
            -q

      - name: Live manifest update validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import tempfile
          from pathlib import Path

          from sentinelshield.manifest_diff_analysis import (
              analyze_manifest_diff,
          )

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)

              (root / ".git").mkdir()

              manifest = root / "pyproject.toml"

              manifest.write_text(
                  "[project]\n"
                  'dependencies = ["requests==2.31.0"]\n',
                  encoding="utf-8",
              )

              diff = (
                  "diff --git a/pyproject.toml "
                  "b/pyproject.toml\n"
                  "--- a/pyproject.toml\n"
                  "+++ b/pyproject.toml\n"
                  "@@ -1,2 +1,2 @@\n"
                  " [project]\n"
                  '-dependencies = ["requests==2.31.0"]\n'
                  '+dependencies = ["requests==2.32.0"]\n'
              )

              result = analyze_manifest_diff(
                  root,
                  diff,
                  ["pyproject.toml"],
              )

              assert result.changed_manifest_count == 1
              assert result.dependency_change_count == 1
              assert result.is_safe is True

              change = (
                  result.manifests[0]
                  .dependency_changes[0]
              )

              assert change.name == "requests"
              assert change.old_version == "==2.31.0"
              assert change.new_version == "==2.32.0"
              assert change.change_type == "updated"

          print(
              "TASK 217 live update validation: PASS"
          )
          PY

      - name: Security boundary validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import tempfile
          from pathlib import Path

          from sentinelshield.manifest_diff_analysis import (
              ManifestDiffAnalysisError,
              analyze_manifest_diff,
          )

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              (root / ".git").mkdir()

              manifest = root / "package.json"
              manifest.write_text(
                  "{}",
                  encoding="utf-8",
              )

              try:
                  analyze_manifest_diff(
                      root,
                      "",
                      ["../package.json"],
                  )
              except ManifestDiffAnalysisError:
                  pass
              else:
                  raise AssertionError(
                      "Path traversal was accepted"
                  )

              try:
                  analyze_manifest_diff(
                      root,
                      "",
                      [str(manifest)],
                  )
              except ManifestDiffAnalysisError:
                  pass
              else:
                  raise AssertionError(
                      "Absolute path was accepted"
                  )

          print(
              "TASK 217 security boundary validation: PASS"
          )
          PY

      - name: Serialization and redaction validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from sentinelshield.manifest_diff_analysis import (
              analyze_manifest_diff,
          )

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              (root / ".git").mkdir()

              manifest = root / "package.json"
              manifest.write_text(
                  "{}",
                  encoding="utf-8",
              )

              diff = (
                  "diff --git a/package.json "
                  "b/package.json\n"
                  "--- a/package.json\n"
                  "+++ b/package.json\n"
                  "@@ -1 +1,2 @@\n"
                  " {}\n"
                  "+token=super-secret-value\n"
              )

              result = analyze_manifest_diff(
                  root,
                  diff,
                  ["package.json"],
              )

              payload = json.loads(
                  result.to_json()
              )

              rendered = json.dumps(
                  payload,
                  sort_keys=True,
              )

              assert (
                  "super-secret-value"
                  not in rendered
              )

              assert "<REDACTED>" in rendered

          print(
              "TASK 217 serialization/redaction validation: PASS"
          )
          PY

      - name: Task 216 integration compatibility
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import tempfile
          from pathlib import Path

          from sentinelshield.git_diff_collection import (
              GitDiffCollectionResult,
          )
          from sentinelshield.manifest_diff_analysis import (
              analyze_manifest_diff,
          )

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              (root / ".git").mkdir()

              manifest = root / "package.json"
              manifest.write_text(
                  '{"dependencies":{"requests":"1.0.0"}}',
                  encoding="utf-8",
              )

              diff = (
                  "diff --git a/package.json "
                  "b/package.json\n"
                  "--- a/package.json\n"
                  "+++ b/package.json\n"
                  "@@ -1 +1 @@\n"
                  '-{"dependencies":{"requests":"1.0.0"}}\n'
                  '+{"dependencies":{"requests":"2.0.0"}}\n'
              )

              result = analyze_manifest_diff(
                  root,
                  diff,
                  ["package.json"],
              )

              assert result.changed_manifest_count == 1

              collection = GitDiffCollectionResult(
                  repository_root=str(root),
              )

              assert collection.changed_files == 0

          print(
              "TASK 216 -> TASK 217 integration compatibility: PASS"
          )
          PY

      - name: Bytecode protection
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain -- \
              '*.pyc' \
              '*.pyo' \
              '*.pyd' | grep -q .; then
            echo "Unexpected bytecode changes detected"
            exit 1
          fi

          echo "TASK 217 bytecode protection: PASS"

      - name: Final repository check
        shell: bash
        run: |
          set -euo pipefail

          test -f src/sentinelshield/manifest_diff_analysis.py
          test -f tests/test_manifest_diff_analysis.py
          test -f .github/workflows/task-217-manifest-diff-analysis.yml

          echo "TASK 217 final repository check: PASS"

      - name: Final task status
        shell: bash
        run: |
          echo "========================================"
          echo "TASK 217 - MANIFEST DIFF ANALYSIS"
          echo "ALL TASK-SPECIFIC CHECKS PASSED"
          echo "========================================"
