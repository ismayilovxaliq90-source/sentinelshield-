name: TASK 217 - Manifest Diff Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/manifest_diff_analysis.py"
      - "tests/test_manifest_diff_analysis.py"
      - ".github/workflows/task-217-manifest-diff-analysis.yml"
  pull_request:
    paths:
      - "src/sentinelshield/manifest_diff_analysis.py"
      - "tests/test_manifest_diff_analysis.py"
      - ".github/workflows/task-217-manifest-diff-analysis.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  task-217-only:
    name: TASK 217 ONLY
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            pytest

      - name: Validate TASK 217 syntax
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import ast
          from pathlib import Path

          files = [
              Path(
                  "src/sentinelshield/"
                  "manifest_diff_analysis.py"
              ),
              Path(
                  "tests/"
                  "test_manifest_diff_analysis.py"
              ),
          ]

          for path in files:
              ast.parse(
                  path.read_text(
                      encoding="utf-8"
                  ),
                  filename=str(path),
              )
              print(
                  f"SYNTAX PASS: {path}"
              )
          PY

      - name: Validate TASK 217 import
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import sentinelshield.manifest_diff_analysis as m

          required = [
              "ManifestDiffAnalysisError",
              "ManifestDependencyChange",
              "ManifestDiff",
              "ManifestDiffAnalysisResult",
              "analyze_manifest_diff",
              "analyze_manifest_diffs",
              "validate_manifest_diff_analysis",
              "validate_manifest_diff",
          ]

          for name in required:
              assert hasattr(m, name), name

          print("TASK 217 IMPORT PASS")
          PY

      - name: Run TASK 217 tests ONLY
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B -m pytest \
            -q \
            tests/test_manifest_diff_analysis.py

      - name: TASK 217 isolated live check
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import tempfile
          from pathlib import Path

          from sentinelshield.manifest_diff_analysis import (
              analyze_manifest_diff,
              validate_manifest_diff_analysis,
          )

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw).resolve()

              (root / ".git").mkdir()

              (root / "package.json").write_text(
                  "{}",
                  encoding="utf-8",
              )

              diff = (
                  "diff --git a/package.json b/package.json\n"
                  "--- a/package.json\n"
                  "+++ b/package.json\n"
                  "@@ -1 +1,4 @@\n"
                  " {\n"
                  '-  "dependencies": {}\n'
                  '+  "dependencies": {\n'
                  '+    "express": "4.21.0"\n'
                  '+  }\n'
              )

              result = analyze_manifest_diff(
                  root,
                  diff,
                  ["package.json"],
              )

              assert Path(
                  result.repository_root
              ).is_absolute()

              assert result.manifests[0].manager == "npm"

              assert any(
                  item.name == "express"
                  and item.change_type == "added"
                  for item in (
                      result.manifests[0]
                      .dependency_changes
                  )
              )

              assert validate_manifest_diff_analysis(
                  result
              )

          print("TASK 217 LIVE PASS")
          PY

      - name: TASK 217 security check
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import tempfile
          from pathlib import Path

          from sentinelshield.manifest_diff_analysis import (
              ManifestDiffAnalysisError,
              analyze_manifest_diff,
          )

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw).resolve()
              (root / ".git").mkdir()

              try:
                  analyze_manifest_diff(
                      root,
                      "",
                      ["../outside.json"],
                  )
              except ManifestDiffAnalysisError:
                  pass
              else:
                  raise AssertionError(
                      "Path traversal accepted"
                  )

              try:
                  analyze_manifest_diff(
                      root,
                      "",
                      ["/tmp/package.json"],
                  )
              except ManifestDiffAnalysisError:
                  pass
              else:
                  raise AssertionError(
                      "Absolute manifest path accepted"
                  )

              result = analyze_manifest_diff(
                  root,
                  "+token=super-secret-value\n",
                  ["package.json"],
              )

              assert (
                  "super-secret-value"
                  not in result.redacted_diff
              )

          print("TASK 217 SECURITY PASS")
          PY

      - name: Verify TASK 217 did not create bytecode
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain -- \
            '*.pyc' '*.pyo' | grep -q .; then
            echo "Unexpected bytecode change."
            git status --short -- \
              '*.pyc' '*.pyo'
            exit 1
          fi

          echo "BYTECODE PASS"

      - name: Final TASK 217 status
        run: |
          echo "TASK 217 ONLY - PASS"
