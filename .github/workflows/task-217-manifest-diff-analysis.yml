name: TASK 217 - Manifest Diff Analysis

on:
  push:
    paths:
      - "src/sentinelshield/manifest_diff_analysis.py"
      - "tests/test_manifest_diff_analysis.py"
      - ".github/workflows/task-217-manifest-diff-analysis.yml"
  pull_request:
    paths:
      - "src/sentinelshield/manifest_diff_analysis.py"
      - "tests/test_manifest_diff_analysis.py"
      - ".github/workflows/task-217-manifest-diff-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  task-217:
    name: TASK 217 validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate environment
        shell: bash
        run: |
          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/src"
          test -f "$GITHUB_WORKSPACE/src/sentinelshield/manifest_diff_analysis.py"
          test -f "$GITHUB_WORKSPACE/tests/test_manifest_diff_analysis.py"

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python --version
          python -c 'import sys; assert sys.version_info >= (3, 12)'

      - name: Validate Python syntax without generating bytecode
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import ast
          import pathlib

          files = [
              pathlib.Path("src/sentinelshield/manifest_diff_analysis.py"),
              pathlib.Path("tests/test_manifest_diff_analysis.py"),
          ]

          for path in files:
              source = path.read_text(encoding="utf-8")
              ast.parse(source, filename=str(path))
              print(f"SYNTAX PASS: {path}")
          PY

      - name: Validate module API
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import sentinelshield.manifest_diff_analysis as module

          required = [
              "ManifestDiffAnalysisError",
              "ManifestDependencyChange",
              "ManifestDiff",
              "ManifestDiffAnalysisResult",
              "analyze_manifest_diff",
              "analyze_manifest_diffs",
              "validate_manifest_diff_analysis",
              "validate_manifest_diff",
          ]

          for name in required:
              assert hasattr(module, name), name

          print("TASK 217 API PASS")
          PY

      - name: Install pytest
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pytest

      - name: Run TASK 217 tests
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B -m pytest \
            -q \
            tests/test_manifest_diff_analysis.py

      - name: Live absolute-root validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from sentinelshield.manifest_diff_analysis import (
              analyze_manifest_diff,
              validate_manifest_diff_analysis,
          )

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw).resolve()
              (root / ".git").mkdir()

              (root / "package.json").write_text(
                  '{"dependencies":{}}',
                  encoding="utf-8",
              )

              diff = (
                  "diff --git a/package.json b/package.json\n"
                  "--- a/package.json\n"
                  "+++ b/package.json\n"
                  "@@ -1 +1,4 @@\n"
                  " {\n"
                  '-  "dependencies": {}\n'
                  '+  "dependencies": {\n'
                  '+    "express": "4.21.0"\n'
                  '+  }\n'
              )

              result = analyze_manifest_diff(
                  root,
                  diff,
                  ["package.json"],
              )

              assert Path(
                  result.repository_root
              ).is_absolute()

              assert result.manifests[0].manager == "npm"

              changes = (
                  result.manifests[0]
                  .dependency_changes
              )

              assert any(
                  change.name == "express"
                  and change.change_type == "added"
                  for change in changes
              )

              assert validate_manifest_diff_analysis(
                  result
              )

              json.loads(result.to_json())

          print("TASK 217 LIVE VALIDATION PASS")
          PY

      - name: Security boundary validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import tempfile
          from pathlib import Path

          from sentinelshield.manifest_diff_analysis import (
              ManifestDiffAnalysisError,
              analyze_manifest_diff,
          )

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw).resolve()
              (root / ".git").mkdir()
              (root / "package.json").write_text(
                  "{}",
                  encoding="utf-8",
              )

              try:
                  analyze_manifest_diff(
                      root,
                      "",
                      ["../outside.json"],
                  )
              except ManifestDiffAnalysisError:
                  pass
              else:
                  raise AssertionError(
                      "Path traversal was accepted"
                  )

              try:
                  analyze_manifest_diff(
                      root,
                      "",
                      ["/tmp/package.json"],
                  )
              except ManifestDiffAnalysisError:
                  pass
              else:
                  raise AssertionError(
                      "Absolute manifest path was accepted"
                  )

              diff = (
                  "diff --git a/package.json b/package.json\n"
                  "--- a/package.json\n"
                  "+++ b/package.json\n"
                  "@@ -1 +1 @@\n"
                  '+token=super-secret-value\n'
              )

              result = analyze_manifest_diff(
                  root,
                  diff,
                  ["package.json"],
              )

              assert (
                  "super-secret-value"
                  not in result.redacted_diff
              )

          print("TASK 217 SECURITY VALIDATION PASS")
          PY

      - name: Verify no Python bytecode changes
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain -- \
            '*.pyc' '*.pyo' | grep -q .; then
            echo "Unexpected Python bytecode change detected."
            git status --short -- '*.pyc' '*.pyo'
            exit 1
          fi

          echo "BYTECODE PROTECTION PASS"

      - name: Final TASK 217 status
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import sentinelshield.manifest_diff_analysis

          print("TASK 217 - MANIFEST DIFF ANALYSIS - PASS")
          PY
