name: Task 217 - Manifest Diff Analysis

on:
  push:
    paths:
      - "src/sentinelshield/manifest_diff_analysis.py"
      - "tests/test_manifest_diff_analysis.py"
      - ".github/workflows/task-217-manifest-diff-analysis.yml"
  pull_request:
    paths:
      - "src/sentinelshield/manifest_diff_analysis.py"
      - "tests/test_manifest_diff_analysis.py"
      - ".github/workflows/task-217-manifest-diff-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  task-217:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Python syntax without bytecode writes
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import ast
          from pathlib import Path

          files = [
              Path("src/sentinelshield/manifest_diff_analysis.py"),
              Path("tests/test_manifest_diff_analysis.py"),
          ]

          for path in files:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )

          print("TASK 217 AST SYNTAX: PASS")
          PY

      - name: Validate import
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          import sentinelshield.manifest_diff_analysis as module

          required = [
              "ManifestChange",
              "ManifestChangeType",
              "ManifestDiffResult",
              "analyze_manifest_diff",
              "analyze_manifest_mapping",
              "validate_manifest_diff",
          ]

          missing = [
              name for name in required
              if not hasattr(module, name)
          ]

          if missing:
              raise SystemExit(
                  f"Missing required API: {missing}"
              )

          print("TASK 217 IMPORT: PASS")
          PY

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Task 217 tests only
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B -m pytest \
            -q \
            tests/test_manifest_diff_analysis.py

      - name: Run live manifest diff validation
        shell: bash
        run: |
          set -euo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python -B - <<'PY'
          from sentinelshield.manifest_diff_analysis import (
              ManifestChange,
              ManifestChangeType,
              analyze_manifest_diff,
          )

          expected = ManifestChange(
              "package.json",
              ManifestChangeType.MODIFIED,
              added_dependencies=("safe-package",),
          )

          passed = analyze_manifest_diff(
              [expected],
              expected_manifest_paths=("package.json",),
              expected_added_dependencies=("safe-package",),
          )

          assert passed.passed is True

          unexpected = ManifestChange(
              "package.json",
              ManifestChangeType.MODIFIED,
              added_dependencies=("unexpected-package",),
          )

          failed = analyze_manifest_diff(
              [unexpected],
              expected_manifest_paths=("package.json",),
          )

          assert failed.passed is False
          assert failed.unexpected_added_dependencies == (
              "unexpected-package",
          )

          print("TASK 217 LIVE VALIDATION: PASS")
          PY

      - name: Verify no bytecode changes were created
        shell: bash
        run: |
          set -euo pipefail

          if git status --porcelain -- \
              '*.pyc' \
              '*.pyo'; then
            :
          fi

          if git status --porcelain -- \
              '*.pyc' \
              '*.pyo' | grep -q .; then
            echo "Unexpected bytecode changes detected."
            exit 1
          fi

          echo "BYTECODE PROTECTION: PASS"

      - name: Final Task 217 status
        run: echo "TASK 217 - MANIFEST DIFF ANALYSIS: PASS"
