name: Task 201 - Lockfile Regeneration

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-201:
    name: Task 201 Server Validation
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify SentinelShield import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield"

      - name: Run Task 201 unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_lockfile_regeneration.py

      - name: Run isolated npm regeneration fixture
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          cd "$WORKDIR"

          cat > package.json <<'JSON'
          {
            "name": "sentinelshield-task-201-fixture",
            "version": "1.0.0",
            "private": true,
            "dependencies": {}
          }
          JSON

          python - <<'PY'
          import json
          from pathlib import Path

          from sentinelshield.lockfile_regeneration import (
              LockfileRegenerationRequest,
              regenerate_lockfile,
              validate_regeneration_result,
          )

          root = Path.cwd()
          manifest = root / "package.json"
          lockfile = root / "package-lock.json"

          request = LockfileRegenerationRequest(
              repository_root=root,
              ecosystem="npm",
              package_manager="npm",
              manifest=manifest,
              lockfile=lockfile,
              timeout=180,
          )

          result = regenerate_lockfile(request)

          print(
              json.dumps(
                  result.to_dict(),
                  indent=2,
              )
          )

          if not validate_regeneration_result(result):
              raise RuntimeError(
                  "TASK 201 FAIL: "
                  + result.reason
              )

          if result.command != (
              "npm",
              "install",
              "--package-lock-only",
              "--ignore-scripts",
              "--no-audit",
              "--no-fund",
          ):
              raise RuntimeError(
                  "TASK 201 FAIL: unexpected command"
              )

          if not lockfile.exists():
              raise RuntimeError(
                  "TASK 201 FAIL: lockfile missing"
              )

          if lockfile.is_symlink():
              raise RuntimeError(
                  "TASK 201 FAIL: lockfile is symlink"
              )

          if not lockfile.is_file():
              raise RuntimeError(
                  "TASK 201 FAIL: lockfile is not file"
              )

          if lockfile.stat().st_size == 0:
              raise RuntimeError(
                  "TASK 201 FAIL: lockfile is empty"
              )

          data = json.loads(
              lockfile.read_text(encoding="utf-8")
          )

          if "lockfileVersion" not in data:
              raise RuntimeError(
                  "TASK 201 FAIL: lockfileVersion missing"
              )

          if "packages" not in data:
              raise RuntimeError(
                  "TASK 201 FAIL: packages section missing"
              )

          print(
              "TASK 201 PASS: "
              "npm lockfile regenerated and validated"
          )
          PY

      - name: Verify no bytecode changes
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 201 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

          echo "TASK 201 PASS: no Python bytecode changes"

      - name: Final Task 201 status
        run: |
          echo "TASK 201 SERVER VALIDATION COMPLETE"
