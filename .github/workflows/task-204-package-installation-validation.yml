name: TASK 204 - Package Installation Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/package_installation_validation.py"
      - "tests/test_package_installation_validation.py"
      - ".github/workflows/task-204-package-installation-validation.yml"

permissions:
  contents: read

jobs:
  task-204:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_NO_INPUT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify module import
        run: |
          python -c "import sentinelshield.package_installation_validation"

      - name: Run TASK 204 unit tests
        run: |
          python -m pytest -q tests/test_package_installation_validation.py

      - name: Create isolated npm fixture
        run: |
          rm -rf "$RUNNER_TEMP/task-204-fixture"
          mkdir -p "$RUNNER_TEMP/task-204-fixture"

          cat > "$RUNNER_TEMP/task-204-fixture/package.json" <<'JSON'
          {
            "name": "task-204-fixture",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "is-number": "7.0.0"
            }
          }
          JSON

          cd "$RUNNER_TEMP/task-204-fixture"

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Validate real npm installation
        working-directory: ${{ runner.temp }}/task-204-fixture
        run: |
          npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund

          test -d node_modules/is-number
          test -f package-lock.json
          test -s package-lock.json

          node -e "const p=require('./node_modules/is-number/package.json'); if(p.version !== '7.0.0') process.exit(1)"

      - name: Verify TASK 204 source integrity
        run: |
          git diff --check

      - name: Verify no changed bytecode
        run: |
          if git status --porcelain | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "TASK 204 FAIL: bytecode changes detected"
            exit 1
          fi

      - name: TASK 204 PASS
        run: |
          echo "TASK 204 PASS: package installation validation completed on isolated GitHub runner"
