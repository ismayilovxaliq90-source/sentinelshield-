name: TASK 204 - Package Installation Validation

on:
  push:
    paths:
      - "src/sentinelshield/package_installation_validation.py"
      - "tests/test_package_installation_validation.py"
      - ".github/workflows/task-204-package-installation-validation.yml"
  pull_request:
    paths:
      - "src/sentinelshield/package_installation_validation.py"
      - "tests/test_package_installation_validation.py"
      - ".github/workflows/task-204-package-installation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-204:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pytest
        run: |
          python -m pip install \
            --disable-pip-version-check \
            pytest

      - name: Verify Task 204 import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c \
            "import sentinelshield.package_installation_validation"

      - name: Run Task 204 unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q \
            tests/test_package_installation_validation.py

      - name: Prepare isolated npm fixture
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"

          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"

          cd "$FIXTURE"

          git init -q

          cat > package.json <<'JSON'
          {
            "name": "sentinelshield-task-204-fixture",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "is-number": "7.0.0"
            }
          }
          JSON

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

          test -f package-lock.json

      - name: Verify Task 201 lockfile input
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"
          cd "$FIXTURE"

          node - <<'NODE'
          const fs = require("fs");

          const lock = JSON.parse(
            fs.readFileSync("package-lock.json", "utf8")
          );

          if (
            typeof lock !== "object" ||
            lock === null
          ) {
            throw new Error("Invalid package-lock.json");
          }

          if (!("lockfileVersion" in lock)) {
            throw new Error("lockfileVersion missing");
          }

          if (!("packages" in lock)) {
            throw new Error("packages missing");
          }

          console.log(
            "Task 201 lockfile input PASS:",
            lock.lockfileVersion
          );
          NODE

      - name: Verify Task 202 dependency-tree input
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"
          cd "$FIXTURE"

          npm ls \
            --all \
            --json \
            --package-lock-only \
            > "$RUNNER_TEMP/task-204-tree.json"

          node - <<'NODE'
          const fs = require("fs");

          const tree = JSON.parse(
            fs.readFileSync(
              process.env.RUNNER_TEMP + "/task-204-tree.json",
              "utf8"
            )
          );

          if (
            typeof tree !== "object" ||
            tree === null
          ) {
            throw new Error("Invalid dependency tree");
          }

          if (
            !("dependencies" in tree) &&
            !("packages" in tree)
          ) {
            throw new Error(
              "Dependency tree contains no dependency/package data"
            );
          }

          console.log("Task 202 dependency-tree input PASS");
          NODE

      - name: Execute real package installation
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"

          cd "$FIXTURE"

          npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund

          test -d node_modules
          test -f node_modules/is-number/package.json

      - name: Validate Task 203 installation integrity
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"

          cd "$FIXTURE"

          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");

          const packageFile =
            "node_modules/is-number/package.json";

          if (!fs.statSync(packageFile).isFile()) {
            throw new Error("Installed package metadata missing");
          }

          const packageData = JSON.parse(
            fs.readFileSync(packageFile, "utf8")
          );

          if (packageData.name !== "is-number") {
            throw new Error("Installed package name mismatch");
          }

          if (packageData.version !== "7.0.0") {
            throw new Error(
              "Installed package version mismatch"
            );
          }

          const digest = crypto
            .createHash("sha256")
            .update(fs.readFileSync(packageFile))
            .digest("hex");

          if (digest.length !== 64) {
            throw new Error("Invalid SHA-256 digest");
          }

          console.log(
            "Task 203 integrity validation PASS:",
            digest
          );
          NODE

      - name: Validate Task 204 with SentinelShield
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"

          cat > "$RUNNER_TEMP/task_204_live_check.py" <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(
              0,
              os.path.join(
                  os.environ["GITHUB_WORKSPACE"],
                  "src",
              ),
          )

          from sentinelshield.package_installation_validation import (
              validate_installed_state,
              validate_installation_result,
          )

          root = Path(
              os.environ["RUNNER_TEMP"]
          ) / "task-204-fixture"

          result = validate_installed_state(root)

          if not validate_installation_result(result):
              print("TASK 204 FAIL: invalid validation result")
              print(result.to_dict())
              raise SystemExit(1)

          if not result.success:
              print("TASK 204 FAIL: installed state invalid")
              print(result.to_dict())
              raise SystemExit(1)

          if result.expected_packages != (
              "is-number",
          ):
              print("TASK 204 FAIL: expected package mismatch")
              raise SystemExit(1)

          if len(result.installed_packages) != 1:
              print("TASK 204 FAIL: installed package count mismatch")
              raise SystemExit(1)

          package = result.installed_packages[0]

          if package.name != "is-number":
              print("TASK 204 FAIL: package name mismatch")
              raise SystemExit(1)

          if package.version != "7.0.0":
              print("TASK 204 FAIL: package version mismatch")
              raise SystemExit(1)

          if not result.lockfile_present:
              print("TASK 204 FAIL: lockfile missing")
              raise SystemExit(1)

          if not result.installation_directory_present:
              print("TASK 204 FAIL: node_modules missing")
              raise SystemExit(1)

          print("TASK 204 PASS")
          print("package:", package.name)
          print("version:", package.version)
          PY

          PYTHONPATH="$GITHUB_WORKSPACE/src" \
          PYTHONDONTWRITEBYTECODE=1 \
          python "$RUNNER_TEMP/task_204_live_check.py"

          rm -f "$RUNNER_TEMP/task_204_live_check.py"

      - name: Verify fixture repository remains clean
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/task-204-fixture"

          STATUS="$(git status --porcelain=v1)"

          if [ -n "$STATUS" ]; then
            echo "TASK 204 FAIL: fixture repository changed"
            printf '%s\n' "$STATUS"
            exit 1
          fi

          echo "TASK 204 repository-state PASS"

      - name: Verify source repository has no bytecode changes
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          if git status --porcelain=v1 | grep -E \
            '(^|[[:space:]])[^[:space:]]*\.pyc$|__pycache__'; then
            echo "TASK 204 FAIL: bytecode changes detected"
            exit 1
          fi

          echo "TASK 204 bytecode verification PASS"
