name: TASK 204 - Package Installation Validation

on:
  push:
    paths:
      - "src/sentinelshield/package_installation_validation.py"
      - "tests/test_package_installation_validation.py"
      - ".github/workflows/task-204-package-installation-validation.yml"
  pull_request:
    paths:
      - "src/sentinelshield/package_installation_validation.py"
      - "tests/test_package_installation_validation.py"
      - ".github/workflows/task-204-package-installation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-204:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      npm_config_ignore_scripts: "true"
      npm_config_audit: "false"
      npm_config_fund: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify module import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.package_installation_validation"

      - name: Run TASK 204 unit tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_package_installation_validation.py

      - name: Prepare isolated installation fixture
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"

          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"

          cd "$FIXTURE"

          cat > package.json <<'JSON'
          {
            "name": "sentinelshield-task-204-fixture",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "preinstall": "node -e \"process.exit(99)\"",
              "postinstall": "node -e \"process.exit(99)\""
            },
            "dependencies": {
              "is-number": "7.0.0"
            }
          }
          JSON

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

          test -f package-lock.json

      - name: Execute real TASK 204 package installation
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"

          cat > "$RUNNER_TEMP/task_204_live_check.py" <<PY
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "${GITHUB_WORKSPACE}/src")

          from sentinelshield.package_installation_validation import (
              InstalledPackage,
              PackageInstallationRequest,
              attach_installed_packages,
              execute_package_installation,
              validate_package_installation_result,
          )

          root = Path("${FIXTURE}")

          result = execute_package_installation(
              PackageInstallationRequest(
                  workspace=root,
                  manager="npm",
                  timeout=180.0,
              )
          )

          if not validate_package_installation_result(result):
              print("TASK 204 FAIL: invalid installation result")
              print(result.to_dict())
              raise SystemExit(1)

          if not result.success:
              print("TASK 204 FAIL: package installation failed")
              print(result.to_dict())
              raise SystemExit(1)

          if result.returncode != 0:
              raise SystemExit(
                  "TASK 204 FAIL: installation return code is not zero"
              )

          node_modules = root / "node_modules"
          package_path = node_modules / "is-number"

          if not node_modules.is_dir():
              raise SystemExit(
                  "TASK 204 FAIL: node_modules was not created"
              )

          if not package_path.is_dir():
              raise SystemExit(
                  "TASK 204 FAIL: expected dependency was not installed"
              )

          package_json = package_path / "package.json"

          if not package_json.is_file():
              raise SystemExit(
                  "TASK 204 FAIL: installed package metadata missing"
              )

          metadata = json.loads(
              package_json.read_text(encoding="utf-8")
          )

          if metadata.get("name") != "is-number":
              raise SystemExit(
                  "TASK 204 FAIL: installed package name mismatch"
              )

          if metadata.get("version") != "7.0.0":
              raise SystemExit(
                  "TASK 204 FAIL: installed package version mismatch"
              )

          verified = attach_installed_packages(
              result,
              (
                  InstalledPackage(
                      name="is-number",
                      version=str(metadata["version"]),
                      source="npm",
                  ),
              ),
          )

          if len(verified.installed_packages) != 1:
              raise SystemExit(
                  "TASK 204 FAIL: installed package evidence missing"
              )

          print("TASK 204 PASS")
          print("manager:", verified.manager)
          print("returncode:", verified.returncode)
          print(
              "installed:",
              verified.installed_packages[0].name,
              verified.installed_packages[0].version,
          )
          PY

          PYTHONPATH="$GITHUB_WORKSPACE/src" \
          PYTHONDONTWRITEBYTECODE=1 \
          python "$RUNNER_TEMP/task_204_live_check.py"

          rm -f "$RUNNER_TEMP/task_204_live_check.py"

      - name: Verify lifecycle scripts were not executed
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"

          test -d "$FIXTURE/node_modules"
          test -d "$FIXTURE/node_modules/is-number"

          echo "TASK 204 lifecycle-script protection PASS"

      - name: Verify installation stayed outside repository
        run: |
          set -euo pipefail

          FIXTURE="$RUNNER_TEMP/task-204-fixture"

          case "$FIXTURE" in
            "$GITHUB_WORKSPACE"/*)
              echo "TASK 204 FAIL: fixture is inside repository"
              exit 1
              ;;
          esac

          echo "TASK 204 workspace isolation PASS"

      - name: Verify no repository bytecode changes
        run: |
          set -euo pipefail

          if git status --porcelain=v1 | grep -E '(^|[[:space:]])[^[:space:]]*\.pyc$|__pycache__'; then
            echo "TASK 204 FAIL: bytecode changes detected"
            exit 1
          fi

          echo "TASK 204 bytecode verification PASS"
