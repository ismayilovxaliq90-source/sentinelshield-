name: Task 183 Server Validation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-183:
    name: Task 183 Existing Change Protection
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify Task 183 source exists
        run: |
          test -f src/sentinelshield/existing_change_protection.py
          test -f tests/test_existing_change_protection.py

      - name: Run Task 183 unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH=src \
          python -m pytest \
            tests/test_existing_change_protection.py \
            -q

      - name: Task 183 Server Validation
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH=src \
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          from sentinelshield.existing_change_protection import (
              capture_existing_change_protection,
              validate_existing_change_protection,
          )

          def run_git(repo: Path, *args: str) -> None:
              subprocess.run(
                  ["git", *args],
                  cwd=repo,
                  text=True,
                  capture_output=True,
                  check=True,
              )

          with tempfile.TemporaryDirectory() as temp:
              repo = Path(temp) / "repo"
              repo.mkdir()

              run_git(repo, "init")

              protected = repo / "user_file.txt"
              protected.write_text("baseline")

              run_git(repo, "add", "user_file.txt")

              run_git(
                  repo,
                  "-c",
                  "user.name=Task183",
                  "-c",
                  "user.email=task183@example.invalid",
                  "commit",
                  "-m",
                  "baseline",
              )

              protected.write_text(
                  "pre-existing user work that must survive"
              )

              protection = capture_existing_change_protection(repo)

              print("=== TASK 183 — EXISTING CHANGE PROTECTION ===")
              print(f"capture_valid: {protection.valid}")
              print(f"protected_change_count: {len(protection.changes)}")
              print(f"capture_reason: {protection.reason}")

              for change in protection.changes:
                  print(
                      f"PROTECTED: {change.status!r} "
                      f"{change.path!r}"
                  )

              if not protection.valid:
                  raise SystemExit(
                      f"TASK 183 FAIL: {protection.reason}"
                  )

              remediation_file = (
                  repo / "new_remediation_change.txt"
              )
              remediation_file.write_text(
                  "new remediation work"
              )

              preserved = validate_existing_change_protection(
                  protection
              )

              print("--- Preservation test ---")
              print(f"valid: {preserved.valid}")
              print(f"protected: {preserved.protected}")
              print(f"violations: {preserved.violations}")
              print(f"reason: {preserved.reason}")

              if not preserved.valid or not preserved.protected:
                  raise SystemExit(
                      "TASK 183 FAIL: existing change was not preserved"
                  )

              protected.write_text(
                  "REMediation incorrectly overwrote protected work"
              )

              violated = validate_existing_change_protection(
                  protection
              )

              print("--- Tamper detection test ---")
              print(f"valid: {violated.valid}")
              print(f"protected: {violated.protected}")
              print(f"violations: {violated.violations}")
              print(f"reason: {violated.reason}")

              if not violated.valid:
                  raise SystemExit(
                      "TASK 183 FAIL: tamper validation could not execute"
                  )

              if violated.protected:
                  raise SystemExit(
                      "TASK 183 FAIL: protected change tampering was not detected"
                  )

              print(
                  "TASK 183 PASS: existing changes are protected "
                  "and tampering is detected"
              )
          PY

      - name: Verify no Python bytecode was generated
        run: |
          if find src tests -type f \
            \( -name "*.pyc" -o -name "*.pyo" \) \
            -print -quit | grep -q .; then
            echo "TASK 183 FAIL: Python bytecode was generated"
            find src tests -type f \
              \( -name "*.pyc" -o -name "*.pyo" \) \
              -print
          else
            echo "No Python bytecode generated."
          fi
