name: TASK 183 - Existing Change Protection

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/existing_change_protection.py"
      - "tests/test_existing_change_protection.py"
      - ".github/workflows/task-183-existing-change-protection.yml"

jobs:
  task-183:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify module import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "from sentinelshield.existing_change_protection import capture_existing_change_protection, validate_existing_change_protection; print('TASK 183 IMPORT PASS')"

      - name: Run TASK 183 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_existing_change_protection.py

      - name: Live deletion validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          from sentinelshield.existing_change_protection import (
              capture_existing_change_protection,
              validate_existing_change_protection,
          )

          with tempfile.TemporaryDirectory() as temporary:
              repo = Path(temporary) / "repo"
              repo.mkdir()

              def git(*args):
                  subprocess.run(
                      ("git", *args),
                      cwd=repo,
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                  )

              git("init")
              git("config", "user.email", "task183@example.invalid")
              git("config", "user.name", "Task 183")

              tracked = repo / "tracked.txt"
              tracked.write_text("original")

              git("add", "tracked.txt")
              git("commit", "-m", "initial")

              tracked.write_text("pre-existing user change")

              protection = capture_existing_change_protection(repo)

              tracked.unlink()

              result = validate_existing_change_protection(protection)

              expected = "PROTECTED_CHANGE_MISSING:tracked.txt"

              if expected not in result.violations:
                  print("TASK 183 FAIL: deletion violation missing")
                  print(result.violations)
                  raise SystemExit(1)

              if result.protected is not False:
                  print("TASK 183 FAIL: deletion accepted")
                  raise SystemExit(1)

              print("TASK 183 DELETION PASS")
          PY

      - name: Live symlink validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          from sentinelshield.existing_change_protection import (
              capture_existing_change_protection,
              validate_existing_change_protection,
          )

          with tempfile.TemporaryDirectory() as temporary:
              repo = Path(temporary) / "repo"
              repo.mkdir()

              def git(*args):
                  subprocess.run(
                      ("git", *args),
                      cwd=repo,
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                  )

              git("init")
              git("config", "user.email", "task183@example.invalid")
              git("config", "user.name", "Task 183")

              a = repo / "a.txt"
              b = repo / "b.txt"
              link = repo / "link.txt"

              a.write_text("A")
              b.write_text("B")
              link.symlink_to(a.name)

              git("add", "a.txt", "b.txt", "link.txt")
              git("commit", "-m", "initial")

              protection = capture_existing_change_protection(repo)

              link.unlink()
              link.symlink_to(b.name)

              result = validate_existing_change_protection(protection)

              expected = "PROTECTED_CONTENT_CHANGED:link.txt"

              if expected not in result.violations:
                  print("TASK 183 FAIL: symlink change not detected")
                  print(result.violations)
                  raise SystemExit(1)

              if result.protected is not False:
                  print("TASK 183 FAIL: symlink change accepted")
                  raise SystemExit(1)

              print("TASK 183 SYMLINK PASS")
          PY

      - name: Verify bytecode did not modify the working tree
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 183 FAIL: bytecode changes detected"
            printf '%s\n' "$changed"
            false
          fi

          echo "TASK 183 BYTECODE PASS"
