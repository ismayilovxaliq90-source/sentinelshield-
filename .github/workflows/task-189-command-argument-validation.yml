name: Task 189 - Command Argument Validation

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  task-189:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify source import path
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.command_argument_validation"

      - name: Run Task 189 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_command_argument_validation.py

      - name: Live security validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.command_argument_validation import (
              validate_command_arguments,
              validate_command_vector,
          )

          print("=== TASK 189 LIVE VALIDATION ===")

          safe = validate_command_arguments(
              "python3",
              ["-m", "pytest", "-q"],
          )

          print("safe.allowed:", safe.allowed)
          print("safe.reason:", safe.reason)

          if not safe.allowed:
              raise RuntimeError(
                  f"TASK 189 FAIL: valid arguments rejected: {safe.reason}"
              )

          malicious_arguments = [
              ["$(id)"],
              ["foo;id"],
              ["foo&&id"],
              ["foo||id"],
              ["../secret"],
              ["foo\x00bar"],
              ["foo\nbar"],
          ]

          for arguments in malicious_arguments:
              result = validate_command_arguments(
                  "python3",
                  arguments,
              )

              print(
                  "blocked:",
                  repr(arguments),
                  "->",
                  result.reason,
              )

              if result.allowed:
                  raise RuntimeError(
                      f"TASK 189 FAIL: malicious argument accepted: "
                      f"{arguments!r}"
                  )

          vector = validate_command_vector(
              ("python3", "-m", "pytest", "-q")
          )

          if not vector.allowed:
              raise RuntimeError(
                  "TASK 189 FAIL: valid command vector rejected"
              )

          injected_vector = validate_command_vector(
              ("python3", "-m", "pytest;id")
          )

          if injected_vector.allowed:
              raise RuntimeError(
                  "TASK 189 FAIL: injected command vector accepted"
              )

          print("TASK 189 PASS: command arguments safely validated")
          PY

      - name: Verify no Python bytecode changes
        run: |
          if git status --porcelain=v1 --untracked-files=all -- \
              '*.pyc' '*.pyo' | grep -q .; then
            echo "TASK 189 FAIL: Python bytecode changes detected"
            git status --short
            exit 1
          fi

          echo "TASK 189 PASS: no Python bytecode changes"

      - name: Final repository status
        run: |
          git status --short
          echo "TASK 189 GitHub Actions validation completed"
