name: TASK 194 - Resource Budget Configuration

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/resource_budget_configuration.py"
      - "tests/test_resource_budget_configuration.py"
      - ".github/workflows/task-194-resource-budget-configuration.yml"

permissions:
  contents: read

jobs:
  task-194:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.resource_budget_configuration"

      - name: Run TASK 194 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_resource_budget_configuration.py

      - name: Live resource budget validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.resource_budget_configuration import (
              ResourceBudgetError,
              ResourceBudgetPolicy,
              configure_resource_budget,
          )

          policy = ResourceBudgetPolicy(
              default_cpu_seconds=60,
              minimum_cpu_seconds=1,
              maximum_cpu_seconds=300,
              default_memory_mb=512,
              minimum_memory_mb=16,
              maximum_memory_mb=2048,
              default_disk_mb=1024,
              minimum_disk_mb=16,
              maximum_disk_mb=4096,
              default_processes=8,
              minimum_processes=1,
              maximum_processes=64,
          )

          result = configure_resource_budget(policy=policy)

          if not result.valid:
              raise SystemExit(
                  "TASK 194 FAIL: valid resource budget rejected"
              )

          budget = result.budget

          if not 1 <= budget.cpu_seconds <= 300:
              raise SystemExit(
                  "TASK 194 FAIL: CPU budget outside policy"
              )

          if not 16 <= budget.memory_mb <= 2048:
              raise SystemExit(
                  "TASK 194 FAIL: memory budget outside policy"
              )

          if not 16 <= budget.disk_mb <= 4096:
              raise SystemExit(
                  "TASK 194 FAIL: disk budget outside policy"
              )

          if not 1 <= budget.processes <= 64:
              raise SystemExit(
                  "TASK 194 FAIL: process budget outside policy"
              )

          for unsafe in (0, -1, True, 1.5, "10"):
              try:
                  configure_resource_budget(
                      cpu_seconds=unsafe,
                      policy=policy,
                  )
              except ResourceBudgetError:
                  continue

              raise SystemExit(
                  "TASK 194 FAIL: unsafe CPU budget accepted"
              )

          try:
              configure_resource_budget(
                  cpu_seconds=301,
                  policy=policy,
              )
          except ResourceBudgetError:
              pass
          else:
              raise SystemExit(
                  "TASK 194 FAIL: CPU maximum bypassed"
              )

          print("TASK 194 PASS")

          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 194 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi

          echo "TASK 194 PASS: no bytecode changes"
