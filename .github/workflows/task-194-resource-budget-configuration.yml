name: TASK 194 - Resource Budget Configuration

on:
  workflow_dispatch:
  push:
    paths:
      - "src/sentinelshield/resource_budget_configuration.py"
      - "tests/test_resource_budget_configuration.py"
      - ".github/workflows/task-194-resource-budget-configuration.yml"

permissions:
  contents: read

jobs:
  task-194:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify import
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -c "import sentinelshield.resource_budget_configuration"

      - name: Run TASK 194 tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pytest -q tests/test_resource_budget_configuration.py

      - name: Live resource budget validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"

          python - <<'PY'
          from sentinelshield.resource_budget_configuration import (
              ResourceBudgetConfigurationError,
              ResourceBudgetPolicy,
              configure_resource_budget,
          )

          policy = ResourceBudgetPolicy(
              cpu_percent=50.0,
              memory_mb=1024.0,
              disk_mb=2048.0,
              process_limit=16,
              max_cpu_percent=100.0,
              max_memory_mb=4096.0,
              max_disk_mb=8192.0,
              max_process_limit=64,
          )

          result = configure_resource_budget(policy=policy)

          if not result.valid:
              raise SystemExit(
                  "TASK 194 FAIL: valid resource budget rejected"
              )

          if not 0 < result.cpu_percent <= 100:
              raise SystemExit(
                  "TASK 194 FAIL: invalid CPU budget"
              )

          if result.memory_mb <= 0 or result.disk_mb <= 0:
              raise SystemExit(
                  "TASK 194 FAIL: non-positive resource budget"
              )

          if result.process_limit <= 0:
              raise SystemExit(
                  "TASK 194 FAIL: invalid process budget"
              )

          for unsafe in (0, -1, float("inf"), float("nan")):
              try:
                  configure_resource_budget(
                      cpu_percent=unsafe,
                      policy=policy,
                  )
              except ResourceBudgetConfigurationError:
                  continue

              raise SystemExit(
                  "TASK 194 FAIL: unsafe CPU budget accepted"
              )

          print("TASK 194 PASS")
          PY

      - name: Verify no bytecode changes
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all -- '*.pyc' '*.pyo')"

          if [ -n "$changed" ]; then
            echo "TASK 194 FAIL: Python bytecode changes detected"
            echo "$changed"
            exit 1
          fi

          echo "TASK 194 PASS: no bytecode changes"
